<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAITMAP - Interactive Respiratory Trait Network Builder</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        
        :root {
            --primary-blue: #2563eb;
            --secondary-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --success-green: #10b981;
            --warning-orange: #f59e0b;
            --danger-red: #ef4444;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --network-bg: #0a0e17;
            --mobile-breakpoint: 768px;
        }
        
        body {
            background: var(--dark-bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }
        
        /* Main Layout */
        .main-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            height: 100vh;
            position: relative;
        }
        
        /* Left Panel - Trait Library & Tools */
        .left-panel {
            background: var(--dark-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .panel-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            background: rgba(30, 41, 59, 0.8);
        }
        
        .panel-header h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .panel-header h2 i {
            color: var(--secondary-blue);
        }
        
        .panel-tabs {
            display: flex;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid var(--border-color);
        }
        
        .panel-tab {
            flex: 1;
            padding: 1rem;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }
        
        .panel-tab.active {
            color: var(--secondary-blue);
            border-bottom-color: var(--secondary-blue);
            background: rgba(59, 130, 246, 0.1);
        }
        
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem;
        }
        
        /* Trait Library */
        .trait-category {
            margin-bottom: 1.5rem;
        }
        
        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }
        
        .category-title {
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .trait-items {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .trait-item {
            padding: 0.75rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: grab;
            transition: all 0.2s;
            user-select: none;
            position: relative;
        }
        
        .trait-item:hover {
            border-color: var(--secondary-blue);
            transform: translateX(4px);
        }
        
        .trait-item.dragging {
            opacity: 0.5;
            transform: scale(0.95);
        }
        
        .trait-name {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
        }
        
        .trait-description {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.3;
        }
        
        /* Tools Panel */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }
        
        .tool-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .tool-card:hover {
            border-color: var(--secondary-blue);
            transform: translateY(-2px);
        }
        
        .tool-card.active {
            border-color: var(--secondary-blue);
            background: rgba(59, 130, 246, 0.1);
        }
        
        .tool-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--secondary-blue), var(--accent-purple));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 0.75rem;
            font-size: 1.2rem;
        }
        
        .tool-name {
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        /* Connection Types */
        .connection-types {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .connection-type {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .connection-type:hover {
            border-color: var(--secondary-blue);
        }
        
        .connection-type.active {
            border-color: var(--secondary-blue);
            background: rgba(59, 130, 246, 0.1);
        }
        
        .connection-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        /* Center Panel - Network Canvas */
        .center-panel {
            background: var(--network-bg);
            position: relative;
            overflow: hidden;
        }
        
        #network-canvas {
            width: 100%;
            height: 100%;
            cursor: default;
        }
        
        /* Network Controls Overlay */
        .network-controls {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 100;
        }
        
        .control-btn {
            width: 40px;
            height: 40px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.2s;
        }
        
        .control-btn:hover {
            background: rgba(30, 41, 59, 0.9);
            border-color: var(--secondary-blue);
            transform: scale(1.05);
        }
        
        .control-btn.active {
            background: var(--secondary-blue);
            border-color: var(--secondary-blue);
            color: white;
        }
        
        /* Simulation Panel */
        .simulation-panel {
            position: absolute;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            backdrop-filter: blur(10px);
            z-index: 100;
            min-width: 300px;
        }
        
        .simulation-status {
            color: var(--text-primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .sim-status-indicator {
            width: 8px;
            height: 8px;
            background: var(--success-green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .simulation-buttons {
            display: flex;
            gap: 0.5rem;
        }
        
        .sim-btn {
            padding: 0.5rem 0.75rem;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        
        .sim-btn:hover {
            background: rgba(51, 65, 85, 0.8);
            border-color: var(--secondary-blue);
        }
        
        .sim-btn.primary {
            background: var(--secondary-blue);
            border-color: var(--secondary-blue);
            color: white;
        }
        
        /* Property Panel */
        .property-panel {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            width: 280px;
            backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
        }
        
        .property-panel.show {
            display: block;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .property-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }
        
        .property-title {
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .property-content {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .property-group {
            margin-bottom: 1.25rem;
        }
        
        .property-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .property-input {
            width: 100%;
            padding: 0.75rem;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.9rem;
        }
        
        .property-input:focus {
            outline: none;
            border-color: var(--secondary-blue);
        }
        
        .property-slider {
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }
        
        .property-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--secondary-blue);
            border-radius: 50%;
            cursor: pointer;
        }
        
        /* Connection Line Drawing */
        .connection-line {
            pointer-events: none;
            stroke-width: 2;
            stroke: var(--secondary-blue);
            stroke-dasharray: 5,5;
            opacity: 0.7;
        }
        
        /* Selection Box */
        .selection-box {
            fill: rgba(59, 130, 246, 0.1);
            stroke: var(--secondary-blue);
            stroke-width: 1;
            stroke-dasharray: 4,4;
            pointer-events: none;
        }
        
        /* Mobile Responsive */
        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            
            .left-panel {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 1000;
                display: none;
            }
            
            .left-panel.show {
                display: flex;
            }
            
            .mobile-toggle {
                position: absolute;
                top: 1rem;
                left: 1rem;
                width: 40px;
                height: 40px;
                background: rgba(15, 23, 42, 0.9);
                border: 1px solid var(--border-color);
                border-radius: 8px;
                color: var(--text-primary);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 1001;
                cursor: pointer;
            }
            
            .property-panel {
                width: calc(100% - 3rem);
                max-width: 280px;
            }
            
            .simulation-panel {
                flex-direction: column;
                gap: 1rem;
                width: calc(100% - 3rem);
            }
        }
        
        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            display: none;
        }
        
        .loading-overlay.show {
            display: flex;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border-color);
            border-top-color: var(--secondary-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            color: var(--text-primary);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            z-index: 1002;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
        }
        
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .toast-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .toast-icon.success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success-green);
        }
        
        .toast-icon.info {
            background: rgba(59, 130, 246, 0.2);
            color: var(--secondary-blue);
        }
        
        .toast-icon.warning {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning-orange);
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>
    
    <!-- Mobile Toggle -->
    <div class="mobile-toggle" id="mobileToggle">
        <i class="fas fa-bars"></i>
    </div>
    
    <!-- Main Container -->
    <div class="main-container">
        <!-- Left Panel -->
        <div class="left-panel" id="leftPanel">
            <div class="panel-header">
                <h2><i class="fas fa-toolbox"></i> TRAITMAP Builder</h2>
            </div>
            
            <div class="panel-tabs">
                <button class="panel-tab active" data-tab="traits">
                    <i class="fas fa-shapes"></i> Traits
                </button>
                <button class="panel-tab" data-tab="tools">
                    <i class="fas fa-tools"></i> Tools
                </button>
                <button class="panel-tab" data-tab="connections">
                    <i class="fas fa-link"></i> Connections
                </button>
            </div>
            
            <div class="panel-content" id="panelContent">
                <!-- Traits Tab -->
                <div class="panel-tab-content active" data-tab="traits">
                    <div class="trait-category">
                        <div class="category-header">
                            <div class="category-title">
                                <i class="fas fa-shield-virus"></i>
                                Immune Traits
                            </div>
                        </div>
                        <div class="trait-items" id="immune-traits">
                            <!-- Immune traits loaded here -->
                        </div>
                    </div>
                    
                    <div class="trait-category">
                        <div class="category-header">
                            <div class="category-title">
                                <i class="fas fa-heartbeat"></i>
                                Physiological
                            </div>
                        </div>
                        <div class="trait-items" id="physio-traits">
                            <!-- Physio traits loaded here -->
                        </div>
                    </div>
                    
                    <div class="trait-category">
                        <div class="category-header">
                            <div class="category-title">
                                <i class="fas fa-x-ray"></i>
                                Clinical
                            </div>
                        </div>
                        <div class="trait-items" id="clinical-traits">
                            <!-- Clinical traits loaded here -->
                        </div>
                    </div>
                </div>
                
                <!-- Tools Tab -->
                <div class="panel-tab-content" data-tab="tools">
                    <div class="tools-grid">
                        <div class="tool-card" data-tool="select">
                            <div class="tool-icon">
                                <i class="fas fa-mouse-pointer"></i>
                            </div>
                            <div class="tool-name">Select</div>
                        </div>
                        <div class="tool-card" data-tool="connect">
                            <div class="tool-icon">
                                <i class="fas fa-link"></i>
                            </div>
                            <div class="tool-name">Connect</div>
                        </div>
                        <div class="tool-card" data-tool="delete">
                            <div class="tool-icon">
                                <i class="fas fa-trash"></i>
                            </div>
                            <div class="tool-name">Delete</div>
                        </div>
                        <div class="tool-card" data-tool="simulate">
                            <div class="tool-icon">
                                <i class="fas fa-play"></i>
                            </div>
                            <div class="tool-name">Simulate</div>
                        </div>
                    </div>
                </div>
                
                <!-- Connections Tab -->
                <div class="panel-tab-content" data-tab="connections">
                    <div class="connection-types">
                        <div class="connection-type active" data-connection="causal">
                            <div class="connection-color" style="background: var(--danger-red);"></div>
                            <div>
                                <div style="font-weight: 600;">Causal</div>
                                <div style="font-size: 0.85rem; color: var(--text-secondary);">A directly causes B</div>
                            </div>
                        </div>
                        <div class="connection-type" data-connection="correlative">
                            <div class="connection-color" style="background: var(--warning-orange);"></div>
                            <div>
                                <div style="font-weight: 600;">Correlative</div>
                                <div style="font-size: 0.85rem; color: var(--text-secondary);">A and B occur together</div>
                            </div>
                        </div>
                        <div class="connection-type" data-connection="therapeutic">
                            <div class="connection-color" style="background: var(--success-green);"></div>
                            <div>
                                <div style="font-weight: 600;">Therapeutic</div>
                                <div style="font-size: 0.85rem; color: var(--text-secondary);">Treatment affects trait</div>
                            </div>
                        </div>
                        <div class="connection-type" data-connection="inhibitory">
                            <div class="connection-color" style="background: var(--secondary-blue);"></div>
                            <div>
                                <div style="font-weight: 600;">Inhibitory</div>
                                <div style="font-size: 0.85rem; color: var(--text-secondary);">A inhibits B</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Center Panel -->
        <div class="center-panel">
            <svg id="network-canvas"></svg>
            
            <!-- Network Controls -->
            <div class="network-controls">
                <button class="control-btn active" data-control="select" title="Select Mode">
                    <i class="fas fa-mouse-pointer"></i>
                </button>
                <button class="control-btn" data-control="pan" title="Pan Mode">
                    <i class="fas fa-hand-paper"></i>
                </button>
                <button class="control-btn" data-control="zoom-in" title="Zoom In">
                    <i class="fas fa-search-plus"></i>
                </button>
                <button class="control-btn" data-control="zoom-out" title="Zoom Out">
                    <i class="fas fa-search-minus"></i>
                </button>
                <button class="control-btn" data-control="reset" title="Reset View">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <button class="control-btn" data-control="clear" title="Clear All">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
            
            <!-- Property Panel -->
            <div class="property-panel" id="propertyPanel">
                <div class="property-header">
                    <div class="property-title" id="propertyTitle">Properties</div>
                    <button class="control-btn" id="closeProperties" style="width: 32px; height: 32px; font-size: 0.9rem;">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="property-content" id="propertyContent">
                    <!-- Properties loaded here -->
                </div>
            </div>
            
            <!-- Simulation Panel -->
            <div class="simulation-panel">
                <div class="simulation-status">
                    <div class="sim-status-indicator"></div>
                    <span>Simulation Ready</span>
                </div>
                <div class="simulation-buttons">
                    <button class="sim-btn" id="addIntervention">
                        <i class="fas fa-plus"></i> Add Intervention
                    </button>
                    <button class="sim-btn primary" id="runSimulation">
                        <i class="fas fa-play"></i> Run Simulation
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <div class="toast-icon info">
            <i class="fas fa-info-circle"></i>
        </div>
        <div class="toast-message" id="toastMessage"></div>
    </div>

    <script>
        // ================================
        // CORE DATA MODELS
        // ================================
        
        class Trait {
            constructor(id, name, category, description, color) {
                this.id = id;
                this.name = name;
                this.category = category;
                this.description = description;
                this.color = color;
                this.x = 0;
                this.y = 0;
                this.size = 40;
                this.value = 50; // Default value 0-100
                this.visible = true;
                this.selected = false;
            }
        }
        
        class Connection {
            constructor(source, target, type, strength = 50) {
                this.id = `${source.id}-${target.id}-${type}`;
                this.source = source;
                this.target = target;
                this.type = type; // causal, correlative, therapeutic, inhibitory
                this.strength = strength; // 0-100
                this.direction = 'forward'; // forward, backward, bidirectional
                this.selected = false;
            }
            
            getColor() {
                const colors = {
                    'causal': '#ef4444',
                    'correlative': '#f59e0b',
                    'therapeutic': '#10b981',
                    'inhibitory': '#3b82f6'
                };
                return colors[this.type] || '#94a3b8';
            }
            
            getDashArray() {
                return this.type === 'inhibitory' ? '5,5' : 'none';
            }
        }
        
        class Intervention {
            constructor(traitId, type, value) {
                this.id = Date.now().toString();
                this.traitId = traitId;
                this.type = type; // 'increase', 'decrease', 'set'
                this.value = value;
                this.active = true;
            }
        }
        
        // ================================
        // TRAIT LIBRARY DATABASE
        // ================================
        
        const traitLibrary = {
            immune: [
                new Trait('eos_inflam', 'Eosinophilic Inflammation', 'immune', 
                    'Type-2 inflammation with elevated eosinophils', '#ef4444'),
                new Trait('neut_inflam', 'Neutrophilic Inflammation', 'immune',
                    'Neutrophil-dominated airway inflammation', '#3b82f6'),
                new Trait('allergic', 'Allergic Sensitization', 'immune',
                    'IgE-mediated allergic response', '#f59e0b'),
                new Trait('th2_cytokines', 'Th2 Cytokine Production', 'immune',
                    'Elevated IL-4, IL-5, IL-13', '#8b5cf6')
            ],
            physio: [
                new Trait('airflow_lim', 'Airflow Limitation', 'physio',
                    'Obstructive pattern on spirometry', '#10b981'),
                new Trait('hyperreactivity', 'Bronchial Hyperreactivity', 'physio',
                    'Exaggerated response to stimuli', '#ec4899'),
                new Trait('gas_trapping', 'Gas Trapping', 'physio',
                    'Air trapping on expiration', '#06b6d4'),
                new Trait('mucociliary', 'Mucociliary Dysfunction', 'physio',
                    'Impaired mucus clearance', '#84cc16')
            ],
            clinical: [
                new Trait('cough', 'Cough Hypersensitivity', 'clinical',
                    'Heightened cough reflex', '#f97316'),
                new Trait('dyspnea', 'Exertional Dyspnea', 'clinical',
                    'Breathlessness on exertion', '#6366f1'),
                new Trait('sputum', 'Sputum Production', 'clinical',
                    'Chronic mucus hypersecretion', '#14b8a6'),
                new Trait('wheeze', 'Wheeze', 'clinical',
                    'Musical breath sounds', '#a855f7')
            ]
        };
        
        // ================================
        // APPLICATION STATE
        // ================================
        
        const appState = {
            currentMode: 'select', // select, pan, connect, delete, simulate
            currentConnectionType: 'causal',
            selectedTraits: new Set(),
            selectedConnections: new Set(),
            isDragging: false,
            isConnecting: false,
            connectionStart: null,
            traits: [],
            connections: [],
            interventions: [],
            simulationRunning: false,
            zoom: 1,
            pan: { x: 0, y: 0 }
        };
        
        // ================================
        // D3 NETWORK VISUALIZATION
        // ================================
        
        class NetworkVisualization {
            constructor(containerId) {
                this.container = d3.select(`#${containerId}`);
                this.width = this.container.node().clientWidth;
                this.height = this.container.node().clientHeight;
                
                this.initSVG();
                this.initSimulation();
                this.initEventHandlers();
                
                // Load initial traits
                this.loadInitialTraits();
            }
            
            initSVG() {
                this.svg = this.container
                    .append('svg')
                    .attr('width', this.width)
                    .attr('height', this.height);
                
                // Define arrow markers for connections
                this.defs = this.svg.append('defs');
                
                ['causal', 'therapeutic', 'inhibitory'].forEach(type => {
                    const color = new Connection(null, null, type).getColor();
                    this.defs.append('marker')
                        .attr('id', `arrow-${type}`)
                        .attr('viewBox', '0 -5 10 10')
                        .attr('refX', 15)
                        .attr('refY', 0)
                        .attr('markerWidth', 6)
                        .attr('markerHeight', 6)
                        .attr('orient', 'auto')
                        .append('path')
                        .attr('d', 'M0,-5L10,0L0,5')
                        .attr('fill', color);
                });
                
                // Main group for zoom/pan
                this.g = this.svg.append('g');
                
                // Groups for different elements
                this.connectionsGroup = this.g.append('g').attr('class', 'connections');
                this.traitsGroup = this.g.append('g').attr('class', 'traits');
                this.selectionGroup = this.g.append('g').attr('class', 'selection');
                
                // Line for drawing new connections
                this.connectionLine = this.g.append('line')
                    .attr('class', 'connection-line')
                    .attr('stroke', '#3b82f6')
                    .style('display', 'none');
                
                // Selection box
                this.selectionBox = this.selectionGroup.append('rect')
                    .attr('class', 'selection-box')
                    .style('display', 'none');
                
                // Setup zoom behavior
                this.zoom = d3.zoom()
                    .scaleExtent([0.1, 4])
                    .on('zoom', (event) => {
                        this.g.attr('transform', event.transform);
                        appState.zoom = event.transform.k;
                        appState.pan = { x: event.transform.x, y: event.transform.y };
                    });
                
                this.svg.call(this.zoom);
            }
            
            initSimulation() {
                this.simulation = d3.forceSimulation()
                    .force('link', d3.forceLink()
                        .id(d => d.id)
                        .distance(150)
                        .strength(d => d.strength / 100))
                    .force('charge', d3.forceManyBody()
                        .strength(-300))
                    .force('center', d3.forceCenter(this.width / 2, this.height / 2))
                    .force('collision', d3.forceCollide().radius(50))
                    .alphaDecay(0.02)
                    .on('tick', () => this.tick());
            }
            
            initEventHandlers() {
                // Handle clicks on background
                this.g.on('click', (event) => {
                    if (event.defaultPrevented) return;
                    
                    // Clear selection if clicking on empty space
                    if (!event.target.classList.contains('trait-node') && 
                        !event.target.classList.contains('connection')) {
                        this.clearSelection();
                    }
                });
                
                // Handle drag selection
                let dragStart = null;
                
                this.g.on('mousedown', (event) => {
                    if (event.defaultPrevented) return;
                    
                    if (appState.currentMode === 'select' && event.button === 0) {
                        dragStart = [event.clientX - appState.pan.x, event.clientY - appState.pan.y];
                        this.selectionBox
                            .attr('x', dragStart[0])
                            .attr('y', dragStart[1])
                            .attr('width', 0)
                            .attr('height', 0)
                            .style('display', 'block');
                    }
                });
                
                this.g.on('mousemove', (event) => {
                    if (dragStart) {
                        const x = event.clientX - appState.pan.x;
                        const y = event.clientY - appState.pan.y;
                        const width = x - dragStart[0];
                        const height = y - dragStart[1];
                        
                        this.selectionBox
                            .attr('width', Math.abs(width))
                            .attr('height', Math.abs(height))
                            .attr('x', width > 0 ? dragStart[0] : dragStart[0] + width)
                            .attr('y', height > 0 ? dragStart[1] : dragStart[1] + height);
                    }
                    
                    // Update connection line if connecting
                    if (appState.isConnecting && appState.connectionStart) {
                        const [x, y] = d3.pointer(event, this.g.node());
                        this.connectionLine
                            .attr('x2', x)
                            .attr('y2', y)
                            .style('display', 'block');
                    }
                });
                
                this.g.on('mouseup', (event) => {
                    if (dragStart) {
                        const x = event.clientX - appState.pan.x;
                        const y = event.clientY - appState.pan.y;
                        
                        // Select traits within selection box
                        const minX = Math.min(dragStart[0], x);
                        const maxX = Math.max(dragStart[0], x);
                        const minY = Math.min(dragStart[1], y);
                        const maxY = Math.max(dragStart[1], y);
                        
                        appState.traits.forEach(trait => {
                            if (trait.x >= minX && trait.x <= maxX && 
                                trait.y >= minY && trait.y <= maxY) {
                                this.selectTrait(trait);
                            }
                        });
                        
                        this.selectionBox.style('display', 'none');
                        dragStart = null;
                    }
                });
                
                // Handle window resize
                window.addEventListener('resize', () => this.handleResize());
            }
            
            handleResize() {
                this.width = this.container.node().clientWidth;
                this.height = this.container.node().clientHeight;
                
                this.svg
                    .attr('width', this.width)
                    .attr('height', this.height);
                
                this.simulation.force('center', d3.forceCenter(this.width / 2, this.height / 2));
                this.simulation.alpha(0.3).restart();
            }
            
            loadInitialTraits() {
                // Add some initial traits to the canvas
                const initialTraits = [
                    traitLibrary.immune[0],
                    traitLibrary.physio[0],
                    traitLibrary.clinical[0]
                ];
                
                // Position them in a triangle
                initialTraits.forEach((trait, i) => {
                    const angle = (i / initialTraits.length) * 2 * Math.PI;
                    trait.x = this.width / 2 + Math.cos(angle) * 200;
                    trait.y = this.height / 2 + Math.sin(angle) * 200;
                    this.addTrait(trait);
                });
                
                // Add some initial connections
                this.addConnection(appState.traits[0], appState.traits[1], 'causal', 75);
                this.addConnection(appState.traits[1], appState.traits[2], 'correlative', 60);
                
                this.updateVisualization();
            }
            
            addTrait(trait) {
                appState.traits.push(trait);
                this.updateVisualization();
                this.simulation.nodes(appState.traits);
                this.simulation.alpha(0.3).restart();
                
                showToast(`Added trait: ${trait.name}`, 'success');
            }
            
            addConnection(source, target, type, strength = 50) {
                // Check if connection already exists
                const existing = appState.connections.find(c => 
                    c.source.id === source.id && c.target.id === target.id && c.type === type);
                
                if (existing) {
                    showToast('Connection already exists', 'warning');
                    return;
                }
                
                const connection = new Connection(source, target, type, strength);
                appState.connections.push(connection);
                this.updateVisualization();
                this.simulation.force('link').links(appState.connections);
                this.simulation.alpha(0.3).restart();
                
                showToast(`Added ${type} connection`, 'success');
            }
            
            removeSelected() {
                // Remove selected connections
                appState.connections = appState.connections.filter(c => !c.selected);
                
                // Remove selected traits and their connections
                const traitsToRemove = appState.traits.filter(t => t.selected);
                traitsToRemove.forEach(trait => {
                    appState.connections = appState.connections.filter(c => 
                        c.source.id !== trait.id && c.target.id !== trait.id);
                });
                
                appState.traits = appState.traits.filter(t => !t.selected);
                
                this.clearSelection();
                this.updateVisualization();
                this.simulation.nodes(appState.traits);
                this.simulation.force('link').links(appState.connections);
                this.simulation.alpha(0.3).restart();
                
                showToast(`Removed ${traitsToRemove.length} trait(s)`, 'info');
            }
            
            clearSelection() {
                appState.selectedTraits.clear();
                appState.selectedConnections.clear();
                appState.traits.forEach(t => t.selected = false);
                appState.connections.forEach(c => c.selected = false);
                this.updateVisualization();
                hidePropertyPanel();
            }
            
            selectTrait(trait) {
                if (!event.ctrlKey && !event.metaKey) {
                    this.clearSelection();
                }
                
                trait.selected = !trait.selected;
                if (trait.selected) {
                    appState.selectedTraits.add(trait);
                } else {
                    appState.selectedTraits.delete(trait);
                }
                
                this.showTraitProperties(trait);
                this.updateVisualization();
            }
            
            selectConnection(connection) {
                if (!event.ctrlKey && !event.metaKey) {
                    this.clearSelection();
                }
                
                connection.selected = !connection.selected;
                if (connection.selected) {
                    appState.selectedConnections.add(connection);
                } else {
                    appState.selectedConnections.delete(connection);
                }
                
                this.showConnectionProperties(connection);
                this.updateVisualization();
            }
            
            startConnection(trait) {
                if (appState.currentMode !== 'connect') return;
                
                appState.isConnecting = true;
                appState.connectionStart = trait;
                
                const [x, y] = [trait.x, trait.y];
                this.connectionLine
                    .attr('x1', x)
                    .attr('y1', y)
                    .attr('x2', x)
                    .attr('y2', y)
                    .style('display', 'block');
            }
            
            completeConnection(trait) {
                if (!appState.isConnecting || !appState.connectionStart) return;
                
                if (appState.connectionStart.id !== trait.id) {
                    this.addConnection(appState.connectionStart, trait, appState.currentConnectionType);
                }
                
                this.cancelConnection();
            }
            
            cancelConnection() {
                appState.isConnecting = false;
                appState.connectionStart = null;
                this.connectionLine.style('display', 'none');
            }
            
            showTraitProperties(trait) {
                const content = `
                    <div class="property-group">
                        <label class="property-label">Trait Name</label>
                        <input type="text" class="property-input" value="${trait.name}" 
                               onchange="network.updateTraitProperty('${trait.id}', 'name', this.value)">
                    </div>
                    
                    <div class="property-group">
                        <label class="property-label">Current Value</label>
                        <div style="display: flex; align-items: center; gap: 1rem;">
                            <input type="range" class="property-slider" min="0" max="100" value="${trait.value}"
                                   oninput="network.updateTraitProperty('${trait.id}', 'value', this.value)">
                            <span style="font-weight: 600; min-width: 40px;">${trait.value}%</span>
                        </div>
                    </div>
                    
                    <div class="property-group">
                        <label class="property-label">Size</label>
                        <div style="display: flex; align-items: center; gap: 1rem;">
                            <input type="range" class="property-slider" min="20" max="80" value="${trait.size}"
                                   oninput="network.updateTraitProperty('${trait.id}', 'size', this.value)">
                            <span style="font-weight: 600; min-width: 40px;">${trait.size}</span>
                        </div>
                    </div>
                    
                    <div class="property-group">
                        <label class="property-label">Color</label>
                        <input type="color" class="property-input" value="${trait.color}" 
                               onchange="network.updateTraitProperty('${trait.id}', 'color', this.value)">
                    </div>
                    
                    <div class="property-group">
                        <label class="property-label">Description</label>
                        <textarea class="property-input" rows="3"
                                  onchange="network.updateTraitProperty('${trait.id}', 'description', this.value)">${trait.description}</textarea>
                    </div>
                    
                    <div class="property-group">
                        <button class="sim-btn" style="width: 100%;" 
                                onclick="network.addIntervention('${trait.id}', 'increase')">
                            <i class="fas fa-arrow-up"></i> Increase in Simulation
                        </button>
                        <button class="sim-btn" style="width: 100%; margin-top: 0.5rem;"
                                onclick="network.addIntervention('${trait.id}', 'decrease')">
                            <i class="fas fa-arrow-down"></i> Decrease in Simulation
                        </button>
                    </div>
                `;
                
                showPropertyPanel('Trait Properties', content);
            }
            
            showConnectionProperties(connection) {
                const content = `
                    <div class="property-group">
                        <label class="property-label">Connection Type</label>
                        <select class="property-input" 
                                onchange="network.updateConnectionProperty('${connection.id}', 'type', this.value)">
                            <option value="causal" ${connection.type === 'causal' ? 'selected' : ''}>Causal</option>
                            <option value="correlative" ${connection.type === 'correlative' ? 'selected' : ''}>Correlative</option>
                            <option value="therapeutic" ${connection.type === 'therapeutic' ? 'selected' : ''}>Therapeutic</option>
                            <option value="inhibitory" ${connection.type === 'inhibitory' ? 'selected' : ''}>Inhibitory</option>
                        </select>
                    </div>
                    
                    <div class="property-group">
                        <label class="property-label">Strength</label>
                        <div style="display: flex; align-items: center; gap: 1rem;">
                            <input type="range" class="property-slider" min="1" max="100" value="${connection.strength}"
                                   oninput="network.updateConnectionProperty('${connection.id}', 'strength', this.value)">
                            <span style="font-weight: 600; min-width: 40px;">${connection.strength}%</span>
                        </div>
                    </div>
                    
                    <div class="property-group">
                        <label class="property-label">Direction</label>
                        <select class="property-input" 
                                onchange="network.updateConnectionProperty('${connection.id}', 'direction', this.value)">
                            <option value="forward" ${connection.direction === 'forward' ? 'selected' : ''}>${connection.source.name} → ${connection.target.name}</option>
                            <option value="backward" ${connection.direction === 'backward' ? 'selected' : ''}>${connection.target.name} → ${connection.source.name}</option>
                            <option value="bidirectional" ${connection.direction === 'bidirectional' ? 'selected' : ''}>Bidirectional</option>
                        </select>
                    </div>
                    
                    <div class="property-group">
                        <div style="color: var(--text-secondary); font-size: 0.9rem;">
                            <div><strong>From:</strong> ${connection.source.name}</div>
                            <div><strong>To:</strong> ${connection.target.name}</div>
                        </div>
                    </div>
                `;
                
                showPropertyPanel('Connection Properties', content);
            }
            
            updateTraitProperty(traitId, property, value) {
                const trait = appState.traits.find(t => t.id === traitId);
                if (!trait) return;
                
                trait[property] = property === 'value' || property === 'size' ? parseInt(value) : value;
                this.updateVisualization();
            }
            
            updateConnectionProperty(connectionId, property, value) {
                const connection = appState.connections.find(c => c.id === connectionId);
                if (!connection) return;
                
                connection[property] = property === 'strength' ? parseInt(value) : value;
                this.updateVisualization();
                this.simulation.force('link').links(appState.connections);
                this.simulation.alpha(0.3).restart();
            }
            
            addIntervention(traitId, type) {
                const trait = appState.traits.find(t => t.id === traitId);
                if (!trait) return;
                
                const value = type === 'increase' ? 25 : -25;
                const intervention = new Intervention(traitId, type, value);
                appState.interventions.push(intervention);
                
                showToast(`Added intervention: ${type} ${trait.name}`, 'success');
            }
            
            runSimulation() {
                if (appState.interventions.length === 0) {
                    showToast('Add interventions first to run simulation', 'warning');
                    return;
                }
                
                appState.simulationRunning = true;
                showToast('Running simulation...', 'info');
                
                // Apply interventions
                appState.interventions.forEach(intervention => {
                    const trait = appState.traits.find(t => t.id === intervention.traitId);
                    if (trait) {
                        trait.value = Math.max(0, Math.min(100, trait.value + intervention.value));
                    }
                });
                
                // Propagate effects through connections
                appState.connections.forEach(connection => {
                    if (connection.type === 'causal' || connection.type === 'therapeutic') {
                        const effect = (connection.strength / 100) * (connection.source.value / 100) * 10;
                        connection.target.value = Math.max(0, Math.min(100, 
                            connection.target.value + (connection.direction === 'inhibitory' ? -effect : effect)));
                    }
                });
                
                this.updateVisualization();
                
                setTimeout(() => {
                    appState.simulationRunning = false;
                    showToast('Simulation complete!', 'success');
                }, 1000);
            }
            
            updateVisualization() {
                // Update traits
                const traits = this.traitsGroup
                    .selectAll('.trait-node')
                    .data(appState.traits, d => d.id);
                
                const traitsEnter = traits.enter()
                    .append('g')
                    .attr('class', 'trait-node')
                    .attr('transform', d => `translate(${d.x},${d.y})`)
                    .style('cursor', 'pointer')
                    .call(d3.drag()
                        .on('start', (event, d) => this.dragStarted(event, d))
                        .on('drag', (event, d) => this.dragged(event, d))
                        .on('end', (event, d) => this.dragEnded(event, d)));
                
                // Trait circle
                traitsEnter.append('circle')
                    .attr('r', d => d.size)
                    .attr('fill', d => d.color)
                    .attr('stroke', d => d.selected ? '#ffffff' : 'rgba(255,255,255,0.3)')
                    .attr('stroke-width', d => d.selected ? 3 : 1);
                
                // Trait value indicator
                traitsEnter.append('circle')
                    .attr('r', d => d.size * 0.7)
                    .attr('fill', 'none')
                    .attr('stroke', '#ffffff')
                    .attr('stroke-width', 3)
                    .attr('stroke-dasharray', d => `${(d.value / 100) * 2 * Math.PI * d.size * 0.7}, 1000`)
                    .style('stroke-linecap', 'round');
                
                // Trait label
                traitsEnter.append('text')
                    .attr('text-anchor', 'middle')
                    .attr('dy', d => d.size + 20)
                    .attr('fill', '#ffffff')
                    .attr('font-size', '12px')
                    .attr('font-weight', '600')
                    .attr('paint-order', 'stroke')
                    .attr('stroke', 'rgba(15,23,42,0.8)')
                    .attr('stroke-width', 3)
                    .attr('stroke-linecap', 'round')
                    .attr('stroke-linejoin', 'round')
                    .text(d => d.name);
                
                // Update existing traits
                traits.merge(traitsEnter)
                    .attr('transform', d => `translate(${d.x},${d.y})`)
                    .select('circle')
                    .attr('r', d => d.size)
                    .attr('fill', d => d.color)
                    .attr('stroke', d => d.selected ? '#ffffff' : 'rgba(255,255,255,0.3)')
                    .attr('stroke-width', d => d.selected ? 3 : 1);
                
                traits.merge(traitsEnter)
                    .select('text')
                    .attr('dy', d => d.size + 20)
                    .text(d => d.name);
                
                traits.merge(traitsEnter)
                    .select('circle:nth-child(2)')
                    .attr('stroke-dasharray', d => `${(d.value / 100) * 2 * Math.PI * d.size * 0.7}, 1000`);
                
                traits.exit().remove();
                
                // Event handlers for traits
                this.traitsGroup.selectAll('.trait-node')
                    .on('click', (event, d) => {
                        event.preventDefault();
                        event.stopPropagation();
                        
                        if (appState.currentMode === 'connect') {
                            if (appState.isConnecting) {
                                this.completeConnection(d);
                            } else {
                                this.startConnection(d);
                            }
                        } else {
                            this.selectTrait(d);
                        }
                    })
                    .on('contextmenu', (event, d) => {
                        event.preventDefault();
                        this.showTraitProperties(d);
                    });
                
                // Update connections
                const connections = this.connectionsGroup
                    .selectAll('.connection')
                    .data(appState.connections, d => d.id);
                
                const connectionsEnter = connections.enter()
                    .append('line')
                    .attr('class', 'connection')
                    .attr('stroke', d => d.getColor())
                    .attr('stroke-width', d => d.selected ? 4 : 2)
                    .attr('stroke-dasharray', d => d.getDashArray())
                    .attr('marker-end', d => d.type !== 'correlative' ? `url(#arrow-${d.type})` : null);
                
                connections.merge(connectionsEnter)
                    .attr('stroke', d => d.getColor())
                    .attr('stroke-width', d => d.selected ? 4 : 2)
                    .attr('stroke-dasharray', d => d.getDashArray())
                    .attr('marker-end', d => d.type !== 'correlative' ? `url(#arrow-${d.type})` : null);
                
                connections.exit().remove();
                
                // Event handlers for connections
                this.connectionsGroup.selectAll('.connection')
                    .on('click', (event, d) => {
                        event.preventDefault();
                        event.stopPropagation();
                        this.selectConnection(d);
                    })
                    .on('contextmenu', (event, d) => {
                        event.preventDefault();
                        this.showConnectionProperties(d);
                    });
            }
            
            dragStarted(event, d) {
                if (!event.active) this.simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }
            
            dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }
            
            dragEnded(event, d) {
                if (!event.active) this.simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }
            
            tick() {
                // Update connection positions
                this.connectionsGroup.selectAll('.connection')
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);
                
                // Update trait positions
                this.traitsGroup.selectAll('.trait-node')
                    .attr('transform', d => `translate(${d.x},${d.y})`);
            }
            
            zoomIn() {
                this.svg.transition().call(this.zoom.scaleBy, 1.2);
            }
            
            zoomOut() {
                this.svg.transition().call(this.zoom.scaleBy, 0.8);
            }
            
            resetView() {
                this.svg.transition()
                    .duration(750)
                    .call(this.zoom.transform, d3.zoomIdentity);
            }
            
            clearAll() {
                if (confirm('Clear all traits and connections?')) {
                    appState.traits = [];
                    appState.connections = [];
                    appState.interventions = [];
                    appState.selectedTraits.clear();
                    appState.selectedConnections.clear();
                    
                    this.updateVisualization();
                    this.simulation.nodes(appState.traits);
                    this.simulation.force('link').links([]);
                    
                    showToast('Canvas cleared', 'info');
                }
            }
        }
        
        // ================================
        // UI UTILITIES
        // ================================
        
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const messageEl = document.getElementById('toastMessage');
            const icon = toast.querySelector('.toast-icon');
            
            messageEl.textContent = message;
            
            // Update icon
            icon.className = 'toast-icon ' + type;
            const iconClass = {
                'success': 'fa-check-circle',
                'info': 'fa-info-circle',
                'warning': 'fa-exclamation-triangle',
                'error': 'fa-exclamation-circle'
            }[type] || 'fa-info-circle';
            
            icon.innerHTML = `<i class="fas ${iconClass}"></i>`;
            
            // Show toast
            toast.classList.add('show');
            
            // Auto-hide after 3 seconds
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
        
        function showPropertyPanel(title, content) {
            document.getElementById('propertyTitle').textContent = title;
            document.getElementById('propertyContent').innerHTML = content;
            document.getElementById('propertyPanel').classList.add('show');
        }
        
        function hidePropertyPanel() {
            document.getElementById('propertyPanel').classList.remove('show');
        }
        
        function showLoading() {
            document.getElementById('loadingOverlay').classList.add('show');
        }
        
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('show');
        }
        
        // ================================
        // INITIALIZATION
        // ================================
        
        let network;
        
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize network visualization
            network = new NetworkVisualization('network-canvas');
            
            // Load trait library into left panel
            loadTraitLibrary();
            
            // Set up event listeners
            setupEventListeners();
            
            // Show welcome message
            setTimeout(() => {
                showToast('Welcome to TRAITMAP Builder! Drag traits from the left panel to start.', 'info');
            }, 1000);
            
            console.log('TRAITMAP Interactive Platform Initialized');
        });
        
        function loadTraitLibrary() {
            // Load immune traits
            const immuneContainer = document.getElementById('immune-traits');
            traitLibrary.immune.forEach(trait => {
                const element = createTraitElement(trait);
                immuneContainer.appendChild(element);
            });
            
            // Load physiological traits
            const physioContainer = document.getElementById('physio-traits');
            traitLibrary.physio.forEach(trait => {
                const element = createTraitElement(trait);
                physioContainer.appendChild(element);
            });
            
            // Load clinical traits
            const clinicalContainer = document.getElementById('clinical-traits');
            traitLibrary.clinical.forEach(trait => {
                const element = createTraitElement(trait);
                clinicalContainer.appendChild(element);
            });
        }
        
        function createTraitElement(trait) {
            const div = document.createElement('div');
            div.className = 'trait-item';
            div.draggable = true;
            div.dataset.traitId = trait.id;
            
            div.innerHTML = `
                <div class="trait-name">${trait.name}</div>
                <div class="trait-description">${trait.description}</div>
            `;
            
            // Drag start
            div.addEventListener('dragstart', function(event) {
                this.classList.add('dragging');
                event.dataTransfer.setData('text/plain', trait.id);
                event.dataTransfer.effectAllowed = 'copy';
            });
            
            // Drag end
            div.addEventListener('dragend', function() {
                this.classList.remove('dragging');
            });
            
            return div;
        }
        
        function setupEventListeners() {
            // Panel tabs
            document.querySelectorAll('.panel-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    const tabName = this.dataset.tab;
                    
                    // Update active tab
                    document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Show corresponding content
                    document.querySelectorAll('.panel-tab-content').forEach(content => {
                        content.classList.remove('active');
                        if (content.dataset.tab === tabName) {
                            content.classList.add('active');
                        }
                    });
                });
            });
            
            // Tool selection
            document.querySelectorAll('.tool-card').forEach(tool => {
                tool.addEventListener('click', function() {
                    const toolName = this.dataset.tool;
                    
                    // Update active tool
                    document.querySelectorAll('.tool-card').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Update control mode
                    document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active'));
                    document.querySelector(`.control-btn[data-control="${toolName}"]`).classList.add('active');
                    
                    appState.currentMode = toolName;
                    
                    if (toolName === 'connect') {
                        showToast('Click on a trait to start connecting, then click on another trait', 'info');
                    }
                });
            });
            
            // Connection type selection
            document.querySelectorAll('.connection-type').forEach(type => {
                type.addEventListener('click', function() {
                    document.querySelectorAll('.connection-type').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    appState.currentConnectionType = this.dataset.connection;
                });
            });
            
            // Network controls
            document.querySelectorAll('.control-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const control = this.dataset.control;
                    
                    if (control === 'select' || control === 'pan') {
                        document.querySelectorAll('.control-btn').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        appState.currentMode = control;
                    } else if (control === 'zoom-in') {
                        network.zoomIn();
                    } else if (control === 'zoom-out') {
                        network.zoomOut();
                    } else if (control === 'reset') {
                        network.resetView();
                    } else if (control === 'clear') {
                        network.clearAll();
                    }
                });
            });
            
            // Close property panel
            document.getElementById('closeProperties').addEventListener('click', hidePropertyPanel);
            
            // Simulation buttons
            document.getElementById('runSimulation').addEventListener('click', () => network.runSimulation());
            
            document.getElementById('addIntervention').addEventListener('click', () => {
                if (appState.selectedTraits.size === 0) {
                    showToast('Select a trait first to add intervention', 'warning');
                    return;
                }
                
                const trait = Array.from(appState.selectedTraits)[0];
                network.addIntervention(trait.id, 'increase');
            });
            
            // Mobile toggle
            document.getElementById('mobileToggle').addEventListener('click', function() {
                document.getElementById('leftPanel').classList.toggle('show');
                this.innerHTML = document.getElementById('leftPanel').classList.contains('show') ? 
                    '<i class="fas fa-times"></i>' : '<i class="fas fa-bars"></i>';
            });
            
            // Drop zone for traits
            const canvas = document.getElementById('network-canvas');
            
            canvas.addEventListener('dragover', function(event) {
                event.preventDefault();
                event.dataTransfer.dropEffect = 'copy';
            });
            
            canvas.addEventListener('drop', function(event) {
                event.preventDefault();
                
                const traitId = event.dataTransfer.getData('text/plain');
                const trait = [...traitLibrary.immune, ...traitLibrary.physio, ...traitLibrary.clinical]
                    .find(t => t.id === traitId);
                
                if (trait) {
                    // Create a copy of the trait
                    const newTrait = new Trait(
                        trait.id + '-' + Date.now(),
                        trait.name,
                        trait.category,
                        trait.description,
                        trait.color
                    );
                    
                    // Position at drop location
                    const rect = canvas.getBoundingClientRect();
                    const x = (event.clientX - rect.left - appState.pan.x) / appState.zoom;
                    const y = (event.clientY - rect.top - appState.pan.y) / appState.zoom;
                    
                    newTrait.x = x;
                    newTrait.y = y;
                    
                    network.addTrait(newTrait);
                }
            });
            
            // Keyboard shortcuts
            document.addEventListener('keydown', function(event) {
                // Delete key
                if (event.key === 'Delete' || event.key === 'Backspace') {
                    if (appState.selectedTraits.size > 0 || appState.selectedConnections.size > 0) {
                        network.removeSelected();
                    }
                }
                
                // Escape key
                if (event.key === 'Escape') {
                    network.cancelConnection();
                    hidePropertyPanel();
                }
                
                // Ctrl+A to select all
                if (event.ctrlKey && event.key === 'a') {
                    event.preventDefault();
                    appState.traits.forEach(t => network.selectTrait(t));
                }
            });
            
            // Close left panel when clicking on canvas (mobile)
            canvas.addEventListener('click', function() {
                if (window.innerWidth <= 768) {
                    document.getElementById('leftPanel').classList.remove('show');
                    document.getElementById('mobileToggle').innerHTML = '<i class="fas fa-bars"></i>';
                }
            });
        }
    </script>
</body>
</html>
