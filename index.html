<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interactive Airway Tree - Advanced</title>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.26.0/dist/supabase.min.js"></script>
<style>
  body { margin:0; font-family:sans-serif; background:#f0f8ff; }
  #root { width:100vw; height:100vh; overflow:hidden; }

  /* Node circle */
  .node circle { 
    fill: #1A5F7A; 
    stroke: #0D3B53; 
    stroke-width: 2px; 
    cursor: pointer; 
  }

  /* Node text */
  .node text { 
    fill: #0D1B2A; 
    font-weight: bold; 
    font-size: 14px; 
    text-anchor: middle; 
    pointer-events: none; 
    text-shadow: 1px 1px 1px #ccc; 
  }

  /* Links */
  .link { 
    fill:none; 
    stroke:#2D9596; 
    stroke-width:2px; 
  }

  /* Leaves */
  .leaf { 
    font-size: 12px; 
    fill: #006400; 
    font-weight: bold; 
    cursor: pointer; 
    text-shadow: 1px 1px 1px #ccc;
  }
  .leaf:hover { 
    text-decoration: underline; 
    fill: #228B22; 
  }

  /* Input box */
  .leaf-input { 
    position:absolute; 
    z-index:10; 
    background:#fff; 
    border:1px solid #ccc; 
    padding:4px; 
    border-radius:4px; 
  }

  /* Controls panel */
  .controls { 
    position:absolute; 
    top:10px; 
    left:10px; 
    z-index:20; 
    background:#fff; 
    border:1px solid #ccc; 
    padding:6px; 
    border-radius:6px; 
  }
  .controls button { 
    margin-right:6px; 
    padding:4px 8px; 
    font-weight:bold; 
    cursor:pointer; 
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// --- Supabase Setup ---
const SUPABASE_URL = "https://outubctwarknkajfprcr.supabase.co";
const SUPABASE_KEY = "sb_publishable_7k1KOcW8SxSl_vREzU4KFw_iT8VmeVV";
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// --- Default Tree ---
const defaultTree = {
  name: "Airway Diseases",
  children: [
    { name: "Inflammatory Traits", children:[
        { name:"Eosinophilic", children:[{name:"Predictive Analytics", leaves:[]} ] },
        { name:"Neutrophilic", children:[{name:"Predictive Analytics", leaves:[]} ] }
      ]
    },
    { name:"Airflow Limitation", children:[
        {name:"Bronchoconstriction", children:[{name:"Sensor Analysis", leaves:[]} ] },
        {name:"Fixed Obstruction", children:[{name:"Treatment Optimization", leaves:[]} ] }
      ]
    },
    { name:"Exacerbation-Prone Traits", children:[
        {name:"Frequent Exacerbations", children:[{name:"Predictive Analytics", leaves:[]} ] },
        {name:"Infection Susceptibility", children:[{name:"Sensor Analysis", leaves:[]} ] }
      ]
    }
  ]
};

function Tree() {
  const svgRef = useRef();
  const gRef = useRef();
  const [data, setData] = useState(defaultTree);
  const [inputPos, setInputPos] = useState(null);
  const [inputValue, setInputValue] = useState('');
  const [currentNode, setCurrentNode] = useState(null);

  // --- Collapsible flag
  const toggleNode = (d) => { d._children = d.children; d.children = null; };
  
  // --- Load tree from Supabase ---
  useEffect(() => {
    async function fetchTree() {
      const { data: rows } = await supabase.from('trees').select('*').limit(1);
      if (rows.length) setData(rows[0].data);
      else await supabase.from('trees').insert([{name:"default", data:defaultTree}]);
    }
    fetchTree();
  }, []);

  // --- Save tree to Supabase ---
  useEffect(() => {
    async function saveTree() { await supabase.from('trees').update({data}).eq('id',1); }
    saveTree();
    renderTree();
  }, [data]);

  const handleAddLeaf = (node,x,y) => { setCurrentNode(node); setInputPos({x,y}); setInputValue(''); };
  const handleSubmitLeaf = () => {
    if (!inputValue.trim()) return;
    const newData = JSON.parse(JSON.stringify(data));
    const addLeaf = (node) => { if(node===currentNode){node.leaves=node.leaves||[];node.leaves.push(inputValue.trim());} else if(node.children)node.children.forEach(addLeaf); };
    addLeaf(newData); setData(newData); setInputPos(null); setCurrentNode(null);
  };

  const handleEditLeaf = (node,index) => {
    const newText = prompt("Edit leaf:", node.leaves[index]);
    if (newText && newText.trim()!==""){ const newData = JSON.parse(JSON.stringify(data)); const editLeaf = (n)=>{ if(n===node) n.leaves[index]=newText.trim(); else if(n.children)n.children.forEach(editLeaf); }; editLeaf(newData); setData(newData); }
  };

  const handleDeleteLeaf = (node,index) => {
    if(!confirm("Delete this leaf?")) return;
    const newData = JSON.parse(JSON.stringify(data));
    const delLeaf = (n)=>{if(n===node)n.leaves.splice(index,1);else if(n.children)n.children.forEach(delLeaf);};
    delLeaf(newData); setData(newData);
  };

  const handleExport = () => {
    const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url = URL.createObjectURL(blob); const a = document.createElement("a");
    a.href=url; a.download="airway_tree.json"; a.click(); URL.revokeObjectURL(url);
  };

  const renderTree = () => {
    const svg = d3.select(svgRef.current);
    svg.selectAll("*").remove();
    const width = svgRef.current.clientWidth; const height = svgRef.current.clientHeight;

    const g = d3.select(gRef.current);
    const root = d3.hierarchy(data, d=>d.children);
    const treeLayout = d3.tree().size([height-50,width-200]); treeLayout(root);

    // Zoom & Pan
    svg.call(d3.zoom().scaleExtent([0.5,3]).on("zoom", (event)=>{g.attr("transform",event.transform);}))

    // Links
    g.selectAll(".link").data(root.links())
      .enter().append("path").attr("class","link")
      .attr("d", d3.linkHorizontal().x(d=>d.y+100).y(d=>d.x));

    // Nodes
    const nodeGroup = g.selectAll(".node").data(root.descendants())
      .enter().append("g").attr("class","node")
      .attr("transform", d=>`translate(${d.y+100},${d.x})`)
      .on("click", (event,d)=>{
        if(d.children){d._children=d.children;d.children=null;} 
        else{d.children=d._children;d._children=null;}
        renderTree();
      });

    nodeGroup.append("circle").attr("r",18);

    nodeGroup.append("text").attr("dy",4).text(d=>d.data.name);

    // Leaves
    nodeGroup.each(function(d){
      if(d.data.leaves){
        d3.select(this).selectAll(".leaf").data(d.data.leaves)
          .enter().append("text").attr("class","leaf")
          .attr("dy",(leaf,i)=>24+i*16)
          .attr("text-anchor","middle")
          .text(leaf=>leaf)
          .on("click",(event,leaf,i)=>handleEditLeaf(d.data,i))
          .on("contextmenu",(event,leaf,i)=>{event.preventDefault(); handleDeleteLeaf(d.data,i);});
      }
    });
  };

  return <>
    <div className="controls">
      <button onClick={()=>setData(JSON.parse(JSON.stringify(defaultTree)))}>Reset Tree</button>
      <button onClick={handleExport}>Export JSON</button>
    </div>
    <svg ref={svgRef} width="100%" height="100%">
      <g ref={gRef}></g>
    </svg>
    {inputPos && <div className="leaf-input" style={{left:inputPos.x+"px",top:inputPos.y+"px"}}>
      <input type="text" placeholder="Add leaf..." value={inputValue}
        onChange={e=>setInputValue(e.target.value)}
        onKeyDown={e=>e.key==="Enter" && handleSubmitLeaf()}/>
      <button onClick={handleSubmitLeaf}>Add</button>
    </div>}
  </>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Tree />);
</script>
</body>
</html>
