<!DOCTYPE html>
<html>
<head>
    <title>Airway Digital Twin | Connected</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    
    <style>
        /* Basic styles - you can expand */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #0f172a; color: white; }
    </style>
</head>
<body>
    <div id="app">
        <h1>Airway Digital Twin</h1>
        <div id="status">Loading...</div>
        <div id="data"></div>
    </div>

    <script>
        // ====== CORRECT CONFIGURATION ======
        const SUPABASE_URL = 'https://timmylvmumneqhpkvcgb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_8ECsUNA9-wpFnc4wDoTQ7w_ayGcCHT_';
        
        // ====== INITIALIZATION ======
        $(document).ready(async function() {
            console.log('🚀 Starting Airway Digital Twin...');
            
            try {
                // 1. Initialize Supabase
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                
                // 2. Test connection
                $('#status').text('Testing database connection...');
                
                const { data: diseases, error } = await supabase
                    .from('diseases')
                    .select('*')
                    .limit(5);
                
                if (error) {
                    if (error.code === '42501' || error.message.includes('policy')) {
                        $('#status').html(`
                            <div style="color: orange;">
                                <h3>RLS Policy Error</h3>
                                <p>You need to add RLS policies to allow public read access.</p>
                                <p>Run this SQL in Supabase SQL Editor:</p>
                                <pre style="background: #1e293b; padding: 10px; overflow: auto;">
-- Allow public read access
CREATE POLICY "Allow public read access" ON diseases
  FOR SELECT USING (true);
                                </pre>
                            </div>
                        `);
                    } else {
                        $('#status').html(`<div style="color: red;">Database error: ${error.message}</div>`);
                    }
                    return;
                }
                
                // 3. Success - show data
                $('#status').html('<div style="color: green;">✅ Database connected successfully!</div>');
                $('#data').html(`
                    <h3>Available Diseases (${diseases.length})</h3>
                    <ul>
                        ${diseases.map(d => `<li>${d.disease_name} (ID: ${d.id})</li>`).join('')}
                    </ul>
                `);
                
                // 4. Now load traits and build the digital twin
                await loadDigitalTwinData(supabase);
                
            } catch (error) {
                $('#status').html(`<div style="color: red;">Initialization failed: ${error.message}</div>`);
            }
        });
        
        // ====== LOAD DIGITAL TWIN DATA ======
        async function loadDigitalTwinData(supabase) {
            try {
                // Get disease ID from URL or use first disease
                const urlParams = new URLSearchParams(window.location.search);
                const diseaseId = urlParams.get('disease_id') || 1;
                
                // Load disease traits
                const { data: diseaseTraits, error: traitsError } = await supabase
                    .from('disease_traits')
                    .select(`
                        id,
                        prevalence_in_disease,
                        clinical_importance,
                        treatable_traits(*)
                    `)
                    .eq('disease_id', diseaseId);
                
                if (traitsError) throw traitsError;
                
                console.log('Loaded traits:', diseaseTraits);
                
                // Load trait connections
                const traitIds = diseaseTraits.map(dt => dt.treatable_traits.id);
                const { data: connections } = await supabase
                    .from('trait_networks')
                    .select('*')
                    .in('source_trait_id', traitIds)
                    .in('target_trait_id', traitIds);
                
                // Build the digital twin
                buildDigitalTwin(diseaseTraits, connections || []);
                
            } catch (error) {
                console.error('Error loading digital twin data:', error);
                $('#data').append(`<div style="color: orange;">⚠️ Could not load complete data: ${error.message}</div>`);
            }
        }
        
        // ====== BUILD DIGITAL TWIN VISUALIZATION ======
        function buildDigitalTwin(traits, connections) {
            $('#data').append(`
                <div style="margin-top: 20px;">
                    <h3>Digital Twin Ready</h3>
                    <p>Loaded ${traits.length} traits with ${connections.length} connections</p>
                    <div id="twinVisualization" style="width: 100%; height: 400px; background: #1e293b; margin-top: 10px;">
                        <!-- 3D visualization will go here -->
                        <p style="text-align: center; padding-top: 180px;">3D Visualization Loading...</p>
                    </div>
                </div>
            `);
            
            // Initialize Three.js visualization
            init3DVisualization(traits, connections);
        }
        
        // ====== 3D VISUALIZATION ======
        function init3DVisualization(traits, connections) {
            const container = document.getElementById('twinVisualization');
            
            // Scene setup
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.innerHTML = '';
            container.appendChild(renderer.domElement);
            
            // Add trait nodes
            traits.forEach((trait, index) => {
                const geometry = new THREE.SphereGeometry(0.3, 16, 16);
                const material = new THREE.MeshBasicMaterial({ 
                    color: getTraitColor(trait.treatable_traits.category),
                    transparent: true,
                    opacity: 0.8
                });
                
                const sphere = new THREE.Mesh(geometry, material);
                
                // Position in a circle
                const angle = (index / traits.length) * Math.PI * 2;
                const radius = 3;
                sphere.position.x = Math.cos(angle) * radius;
                sphere.position.y = Math.sin(angle) * radius;
                
                scene.add(sphere);
            });
            
            // Camera position
            camera.position.z = 5;
            
            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                scene.rotation.y += 0.005;
                renderer.render(scene, camera);
            }
            animate();
        }
        
        function getTraitColor(category) {
            const colors = {
                'Inflammatory': 0xff6b6b,
                'Physiological': 0x4ecdc4,
                'Behavioral': 0xffd166,
                'Comorbid': 0x118ab2,
                'Environmental': 0x9d4edd
            };
            return colors[category] || 0x888888;
        }
        
        // ====== UTILITY FUNCTIONS ======
        function showError(message) {
            $('#status').html(`<div style="color: red;">❌ ${message}</div>`);
        }
        
        function showSuccess(message) {
            $('#status').html(`<div style="color: green;">✅ ${message}</div>`);
        }
    </script>
</body>
</html>
