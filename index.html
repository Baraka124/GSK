<!DOCTYPE html>
<html>
<head>
    <title>Database Test - Correct Key</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body style="padding: 20px; font-family: Arial;">
    <h1>Testing Database with Correct Key</h1>
    <div id="result" style="margin-top: 20px;"></div>
    
    <script>
        const SUPABASE_URL = 'https://timmylvmumneqhpkvcgb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_8ECsUNA9-wpFnc4wDoTQ7w_ayGcCHT_';
        
        async function testConnection() {
            const resultDiv = document.getElementById('result');
            
            try {
                resultDiv.innerHTML = '<h3>Connecting to database...</h3>';
                
                // Initialize Supabase client
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                
                // Test 1: Check if we can connect
                resultDiv.innerHTML += '<p>Testing connection...</p>';
                
                const { data: testData, error: testError } = await supabase
                    .from('diseases')
                    .select('count')
                    .limit(1);
                
                if (testError) {
                    resultDiv.innerHTML += `<p style="color: orange;">⚠️ Count query failed: ${testError.message}</p>`;
                    resultDiv.innerHTML += '<p>Trying simple select instead...</p>';
                } else {
                    resultDiv.innerHTML += '<p style="color: green;">✅ Count query successful</p>';
                }
                
                // Test 2: Try to get actual data
                const { data: diseases, error: diseaseError } = await supabase
                    .from('diseases')
                    .select('*')
                    .limit(5);
                
                if (diseaseError) {
                    resultDiv.innerHTML += `<p style="color: red;">❌ Diseases query failed: ${diseaseError.message}</p>`;
                } else {
                    resultDiv.innerHTML += `<p style="color: green;">✅ Diseases table accessible (${diseases.length} records)</p>`;
                    diseases.forEach(d => {
                        resultDiv.innerHTML += `<div style="margin-left: 20px;">• ${d.disease_name} (ID: ${d.id})</div>`;
                    });
                }
                
                // Test 3: Check other tables
                const tables = ['treatable_traits', 'disease_traits', 'trait_networks'];
                
                for (const table of tables) {
                    try {
                        const { data, error } = await supabase
                            .from(table)
                            .select('*')
                            .limit(2);
                        
                        if (error) {
                            resultDiv.innerHTML += `<p style="color: orange;">⚠️ Table "${table}": ${error.message}</p>`;
                        } else {
                            resultDiv.innerHTML += `<p style="color: green;">✅ Table "${table}" accessible (${data.length} records)</p>`;
                        }
                    } catch (e) {
                        resultDiv.innerHTML += `<p style="color: red;">❌ Table "${table}" error: ${e.message}</p>`;
                    }
                }
                
                // Test 4: Check RLS (Row Level Security)
                resultDiv.innerHTML += '<h4>Checking Row Level Security...</h4>';
                
                try {
                    const { data: rlsData, error: rlsError } = await supabase
                        .from('diseases')
                        .insert([{ disease_name: 'Test Disease', description: 'Test' }]);
                    
                    if (rlsError && rlsError.code === '42501') {
                        resultDiv.innerHTML += '<p style="color: green;">✅ RLS is enabled (good for security)</p>';
                    } else if (rlsError) {
                        resultDiv.innerHTML += `<p style="color: orange;">⚠️ Insert failed: ${rlsError.message}</p>`;
                    } else {
                        resultDiv.innerHTML += '<p style="color: red;">⚠️ RLS might not be enabled</p>';
                    }
                } catch (e) {
                    resultDiv.innerHTML += `<p style="color: gray;">❓ Could not test RLS: ${e.message}</p>`;
                }
                
                resultDiv.innerHTML += '<h3 style="color: green;">✅ Database connection successful!</h3>';
                
            } catch (error) {
                resultDiv.innerHTML = `
                    <div style="color: red;">
                        <h3>❌ Connection Failed</h3>
                        <p>Error: ${error.message}</p>
                        <p>Possible issues:</p>
                        <ul>
                            <li>CORS not configured</li>
                            <li>RLS blocking access</li>
                            <li>Network issues</li>
                        </ul>
                        <p>Check Supabase Dashboard → Settings → API → CORS Origins</p>
                    </div>
                `;
            }
        }
        
        // Add security warning
        document.getElementById('result').innerHTML = `
            <div style="background: #fff3cd; padding: 15px; margin-bottom: 20px;">
                <strong>⚠️ SECURITY ALERT:</strong> You still need to regenerate your secret key!
                The secret key <code>sb_secret_rs5K0cw_tPMJr2PsQFprUQ_uHjcbc7W</code> is exposed.
            </div>
        `;
        
        // Run test
        testConnection();
    </script>
</body>
</html>
