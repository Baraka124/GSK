<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAITMAP PRO - Clinical Intelligence Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ==================== PROFESSIONAL COLOR SCHEME ==================== */
        :root {
            --primary-blue: #2563eb;
            --secondary-blue: #3b82f6;
            --accent-blue: #60a5fa;
            --dark-bg: #0f172a;
            --panel-bg: #1e293b;
            --card-bg: #334155;
            
            /* Clinical colors */
            --immune: #ef4444;
            --physiological: #10b981;
            --clinical: #f59e0b;
            --comorbid: #8b5cf6;
            --biomarker: #06b6d4;
            --treatment: #ec4899;
            
            /* Evidence levels */
            --evidence-1: #fbbf24;
            --evidence-2: #a3a3a3;
            --evidence-3: #92400e;
            --evidence-4: #6b7280;
            
            /* UI */
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-tertiary: #94a3b8;
            --border: #475569;
            --hover: rgba(255, 255, 255, 0.05);
            
            /* Layout */
            --header-height: 64px;
            --sidebar-width: 300px;
            --properties-width: 340px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        body {
            background: var(--dark-bg);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            font-size: 14px;
            line-height: 1.5;
        }
        
        /* ==================== PROFESSIONAL HEADER ==================== */
        .header {
            height: var(--header-height);
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary-blue), var(--biomarker));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }
        
        .logo-text h1 {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-blue), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* ==================== MINIMALIST MAIN LAYOUT ==================== */
        .main-container {
            display: flex;
            height: 100vh;
            padding-top: var(--header-height);
        }
        
        /* ==================== CLEAN SIDEBAR ==================== */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        
        .search-box {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }
        
        .search-box input {
            width: 100%;
            padding: 0.5rem 0.75rem 0.5rem 2.5rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.875rem;
        }
        
        .search-box i {
            position: absolute;
            left: 1.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
        }
        
        .trait-category {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }
        
        .category-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .trait-item {
            padding: 0.75rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 0.5rem;
            cursor: grab;
            transition: all 0.2s;
        }
        
        .trait-item:hover {
            background: var(--hover);
            border-color: var(--primary-blue);
            transform: translateX(4px);
        }
        
        /* ==================== CANVAS ==================== */
        .canvas-area {
            flex: 1;
            position: relative;
            background: 
                radial-gradient(circle at 20% 30%, rgba(37, 99, 235, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(16, 185, 129, 0.05) 0%, transparent 50%);
        }
        
        #networkCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: default;
        }
        
        /* ==================== DISCREET TOOLS ==================== */
        .tools-panel {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .tool-btn {
            width: 36px;
            height: 36px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .tool-btn:hover {
            background: var(--hover);
            border-color: var(--primary-blue);
        }
        
        .tool-btn.active {
            background: var(--primary-blue);
            border-color: var(--primary-blue);
        }
        
        /* ==================== ELEGANT PROPERTIES PANEL ==================== */
        .properties-panel {
            width: var(--properties-width);
            background: var(--panel-bg);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        
        .property-section {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
        }
        
        /* ==================== SUBTLE AI PANEL (Non-intrusive) ==================== */
        .ai-panel {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            width: 280px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 50;
        }
        
        .ai-panel.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .ai-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .ai-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            color: var(--primary-blue);
        }
        
        .ai-content {
            padding: 1rem;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .ai-suggestion {
            padding: 0.75rem;
            background: var(--card-bg);
            border-radius: 6px;
            margin-bottom: 0.75rem;
            border-left: 3px solid var(--primary-blue);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .ai-suggestion:hover {
            background: var(--hover);
            transform: translateX(2px);
        }
        
        /* ==================== CONNECTION VISUALS ==================== */
        .connection-line {
            stroke-linecap: round;
            stroke-width: 2;
            transition: all 0.2s;
        }
        
        .connection-preview {
            stroke: var(--primary-blue);
            stroke-width: 2;
            stroke-dasharray: 5, 3;
            opacity: 0.7;
        }
        
        /* ==================== STATISTICS OVERLAY ==================== */
        .stats-overlay {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            min-width: 200px;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }
        
        /* ==================== TOAST NOTIFICATIONS ==================== */
        .toast {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%) translateY(100%);
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        
        /* ==================== LOADING STATES ==================== */
        .loading {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--dark-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary-blue);
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* ==================== UTILITY CLASSES ==================== */
        .hidden { display: none; }
        .fade-in { animation: fadeIn 0.3s ease; }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <!-- Minimal Header -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-dna"></i>
            </div>
            <div class="logo-text">
                <h1>TRAITMAP PRO</h1>
            </div>
        </div>
        
        <div class="header-actions">
            <button class="btn" id="btnAI">
                <i class="fas fa-robot"></i>
                <span>AI Analysis</span>
            </button>
            <button class="btn btn-primary" id="btnAnalyze">
                <i class="fas fa-chart-network"></i>
                <span>Analyze</span>
            </button>
        </div>
    </header>
    
    <!-- Main Content -->
    <div class="main-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchTraits" placeholder="Search 150+ clinical traits...">
            </div>
            
            <div class="trait-library">
                <!-- Traits loaded dynamically -->
            </div>
        </aside>
        
        <!-- Canvas Area -->
        <main class="canvas-area">
            <canvas id="networkCanvas"></canvas>
            
            <!-- Tools -->
            <div class="tools-panel">
                <button class="tool-btn active" data-tool="select" title="Select">
                    <i class="fas fa-mouse-pointer"></i>
                </button>
                <button class="tool-btn" data-tool="connect" title="Connect (Shift+Click)">
                    <i class="fas fa-link"></i>
                </button>
                <button class="tool-btn" data-tool="auto" title="Auto-layout">
                    <i class="fas fa-sitemap"></i>
                </button>
                <button class="tool-btn" data-tool="clear" title="Clear selection">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <!-- Statistics -->
            <div class="stats-overlay" id="statsPanel">
                <div class="stat-item">
                    <span>Traits:</span>
                    <span id="traitCount">0</span>
                </div>
                <div class="stat-item">
                    <span>Connections:</span>
                    <span id="connectionCount">0</span>
                </div>
                <div class="stat-item">
                    <span>Complexity:</span>
                    <span id="complexityScore">0</span>
                </div>
            </div>
            
            <!-- AI Panel (Hidden by default) -->
            <div class="ai-panel" id="aiPanel">
                <div class="ai-header">
                    <div class="ai-title">
                        <i class="fas fa-robot"></i>
                        <span>AI Clinical Insights</span>
                    </div>
                    <button class="btn-close" id="closeAIPanel">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="ai-content" id="aiContent">
                    <!-- AI suggestions loaded here -->
                </div>
            </div>
        </main>
        
        <!-- Properties Panel -->
        <aside class="properties-panel" id="propertiesPanel">
            <div class="property-section">
                <h3>Selected Trait</h3>
                <div id="selectedTraitInfo">
                    Select a trait to view details
                </div>
            </div>
        </aside>
    </div>
    
    <!-- Toast Container -->
    <div class="toast" id="toast"></div>
    
    <!-- Loading Screen -->
    <div class="loading" id="loadingScreen">
        <div class="spinner"></div>
    </div>

<script>
// ============================================
// TRAITMAP PRO - Professional Clinical Intelligence
// ============================================

// Global Application State
const AppState = {
    traits: new Map(),
    connections: new Map(),
    selectedTraits: new Set(),
    connectingTrait: null,
    currentTool: 'select',
    
    // Performance
    renderQuality: 1,
    lastRenderTime: 0,
    
    // AI State
    aiActive: false,
    aiModel: 'clinical-v1'
};

// ==================== EXPANDED TRAIT LIBRARY (150+ TRAITS) ====================

const TRAIT_LIBRARY = {
    immune: Array.from({length: 25}, (_, i) => ({
        id: `immune-${i+1}`,
        name: `Immune Trait ${i+1}`,
        category: 'immune',
        color: '#ef4444',
        icon: 'fas fa-shield-virus',
        evidence: Math.floor(Math.random() * 4) + 1,
        severity: Math.floor(Math.random() * 100),
        confidence: 70 + Math.floor(Math.random() * 30),
        biomarkers: ['IL-6', 'TNF-α', 'CRP'],
        treatments: ['Biologics', 'Immunomodulators']
    })),
    
    physiological: Array.from({length: 25}, (_, i) => ({
        id: `physio-${i+1}`,
        name: `Physio Trait ${i+1}`,
        category: 'physiological',
        color: '#10b981',
        icon: 'fas fa-lungs',
        evidence: Math.floor(Math.random() * 4) + 1,
        severity: Math.floor(Math.random() * 100),
        confidence: 70 + Math.floor(Math.random() * 30),
        biomarkers: ['FEV1', 'FVC', 'DLCO'],
        treatments: ['Bronchodilators', 'Rehabilitation']
    })),
    
    clinical: Array.from({length: 25}, (_, i) => ({
        id: `clinical-${i+1}`,
        name: `Clinical Trait ${i+1}`,
        category: 'clinical',
        color: '#f59e0b',
        icon: 'fas fa-stethoscope',
        evidence: Math.floor(Math.random() * 4) + 1,
        severity: Math.floor(Math.random() * 100),
        confidence: 70 + Math.floor(Math.random() * 30),
        biomarkers: ['Symptoms', 'QoL Score'],
        treatments: ['Symptom Management']
    })),
    
    comorbid: Array.from({length: 25}, (_, i) => ({
        id: `comorbid-${i+1}`,
        name: `Comorbidity ${i+1}`,
        category: 'comorbid',
        color: '#8b5cf6',
        icon: 'fas fa-heartbeat',
        evidence: Math.floor(Math.random() * 4) + 1,
        severity: Math.floor(Math.random() * 100),
        confidence: 70 + Math.floor(Math.random() * 30),
        biomarkers: ['Comorbidity Index'],
        treatments: ['Integrated Care']
    })),
    
    biomarker: Array.from({length: 25}, (_, i) => ({
        id: `biomarker-${i+1}`,
        name: `Biomarker ${i+1}`,
        category: 'biomarker',
        color: '#06b6d4',
        icon: 'fas fa-vial',
        evidence: Math.floor(Math.random() * 4) + 1,
        severity: Math.floor(Math.random() * 100),
        confidence: 70 + Math.floor(Math.random() * 30),
        biomarkers: ['Specific Marker'],
        treatments: ['Targeted Therapy']
    })),
    
    treatment: Array.from({length: 25}, (_, i) => ({
        id: `treatment-${i+1}`,
        name: `Treatment ${i+1}`,
        category: 'treatment',
        color: '#ec4899',
        icon: 'fas fa-pills',
        evidence: Math.floor(Math.random() * 4) + 1,
        severity: Math.floor(Math.random() * 100),
        confidence: 70 + Math.floor(Math.random() * 30),
        biomarkers: ['Response Marker'],
        treatments: ['Therapeutic Intervention']
    }))
};

// ==================== PROFESSIONAL APPLICATION ====================

class TraitMapPro {
    constructor() {
        this.canvas = document.getElementById('networkCanvas');
        this.ctx = this.canvas.getContext('2d');
        
        this.init();
    }
    
    init() {
        this.setupCanvas();
        this.loadTraitLibrary();
        this.setupEventListeners();
        this.createInitialNetwork();
        this.startRenderLoop();
        
        this.showToast('TRAITMAP PRO Ready - 150+ clinical traits loaded', 'info');
    }
    
    setupCanvas() {
        this.resizeCanvas();
        window.addEventListener('resize', () => this.resizeCanvas());
    }
    
    resizeCanvas() {
        const rect = this.canvas.parentElement.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        
        this.canvas.width = rect.width * dpr;
        this.canvas.height = rect.height * dpr;
        this.canvas.style.width = rect.width + 'px';
        this.canvas.style.height = rect.height + 'px';
        
        this.ctx.scale(dpr, dpr);
    }
    
    loadTraitLibrary() {
        const library = document.querySelector('.trait-library');
        
        // Combine all traits
        const allTraits = [
            ...TRAIT_LIBRARY.immune,
            ...TRAIT_LIBRARY.physiological,
            ...TRAIT_LIBRARY.clinical,
            ...TRAIT_LIBRARY.comorbid,
            ...TRAIT_LIBRARY.biomarker,
            ...TRAIT_LIBRARY.treatment
        ];
        
        allTraits.forEach(trait => {
            const item = document.createElement('div');
            item.className = 'trait-item';
            item.dataset.traitId = trait.id;
            item.draggable = true;
            
            item.innerHTML = `
                <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem;">
                    <span style="width: 12px; height: 12px; background: ${trait.color}; border-radius: 50%;"></span>
                    <span style="font-weight: 600; font-size: 0.875rem;">${trait.name}</span>
                </div>
                <div style="font-size: 0.75rem; color: var(--text-tertiary);">
                    ${trait.category} • Evidence Level ${trait.evidence}
                </div>
            `;
            
            item.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('trait', JSON.stringify(trait));
            });
            
            library.appendChild(item);
        });
    }
    
    setupEventListeners() {
        // Canvas events
        this.canvas.addEventListener('dragover', (e) => e.preventDefault());
        this.canvas.addEventListener('drop', (e) => this.onCanvasDrop(e));
        this.canvas.addEventListener('mousedown', (e) => this.onCanvasMouseDown(e));
        this.canvas.addEventListener('mousemove', (e) => this.onCanvasMouseMove(e));
        this.canvas.addEventListener('mouseup', (e) => this.onCanvasMouseUp(e));
        
        // Tool buttons
        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const tool = e.currentTarget.dataset.tool;
                this.setTool(tool);
            });
        });
        
        // AI button
        document.getElementById('btnAI').addEventListener('click', () => {
            this.requestAIInsights();
        });
        
        // Analyze button
        document.getElementById('btnAnalyze').addEventListener('click', () => {
            this.analyzeNetwork();
        });
        
        // Close AI panel
        document.getElementById('closeAIPanel').addEventListener('click', () => {
            this.hideAIPanel();
        });
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                this.clearSelection();
                this.cancelConnection();
            } else if (e.key === 'Delete') {
                this.deleteSelected();
            } else if (e.key === 'a' && e.ctrlKey) {
                e.preventDefault();
                this.selectAll();
            } else if (e.key === 'l' && e.ctrlKey) {
                e.preventDefault();
                this.autoLayout();
            }
        });
    }
    
    onCanvasDrop(e) {
        e.preventDefault();
        const rect = this.canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        try {
            const traitData = JSON.parse(e.dataTransfer.getData('trait'));
            this.createTrait(traitData, x, y);
        } catch (err) {
            console.warn('Invalid trait data');
        }
    }
    
    onCanvasMouseDown(e) {
        const rect = this.canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const trait = this.getTraitAt(x, y);
        
        if (trait) {
            if (e.shiftKey) {
                // Shift+Click for connection
                if (!AppState.connectingTrait) {
                    AppState.connectingTrait = trait;
                    this.showToast(`Connecting from ${trait.name}. Click another trait.`, 'info');
                } else {
                    this.createConnection(AppState.connectingTrait, trait);
                    AppState.connectingTrait = null;
                }
            } else {
                // Select trait
                this.selectTrait(trait);
            }
            
            // Start dragging
            AppState.draggingTrait = trait;
            AppState.dragOffset = { x: trait.x - x, y: trait.y - y };
        }
    }
    
    onCanvasMouseMove(e) {
        if (!AppState.draggingTrait) return;
        
        const rect = this.canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        AppState.draggingTrait.x = x + AppState.dragOffset.x;
        AppState.draggingTrait.y = y + AppState.dragOffset.y;
    }
    
    onCanvasMouseUp() {
        AppState.draggingTrait = null;
    }
    
    createTrait(data, x, y) {
        const trait = {
            id: `${data.id}-${Date.now()}`,
            name: data.name,
            category: data.category,
            color: data.color,
            icon: data.icon,
            evidence: data.evidence,
            severity: data.severity,
            confidence: data.confidence,
            x: x,
            y: y,
            connections: new Set()
        };
        
        AppState.traits.set(trait.id, trait);
        this.updateStats();
        this.render();
        
        this.showToast(`Added ${trait.name}`, 'success');
    }
    
    createConnection(source, target) {
        if (source.id === target.id) return;
        
        const connectionId = `${source.id}-${target.id}`;
        
        if (AppState.connections.has(connectionId)) {
            this.showToast('Connection already exists', 'warning');
            return;
        }
        
        const connection = {
            id: connectionId,
            source: source.id,
            target: target.id,
            type: 'correlative',
            strength: 50 + Math.random() * 50,
            certainty: 70 + Math.random() * 30
        };
        
        AppState.connections.set(connectionId, connection);
        source.connections.add(connectionId);
        target.connections.add(connectionId);
        
        this.updateStats();
        this.render();
        
        this.showToast(`Connected ${source.name} → ${target.name}`, 'success');

    selectTrait(trait) {
        AppState.selectedTraits.clear();
        AppState.selectedTraits.add(trait.id);
        
        // Update properties panel
        this.showTraitDetails(trait);
        
        this.render();

    clearSelection() {
        AppState.selectedTraits.clear();
        document.getElementById('selectedTraitInfo').innerHTML = 'Select a trait to view details';
        this.render();
    }
    
    deleteSelected() {
        if (AppState.selectedTraits.size === 0) return;
        
        AppState.selectedTraits.forEach(traitId => {
            const trait = AppState.traits.get(traitId);
            if (trait) {
                // Remove connections
                trait.connections.forEach(connId => {
                    AppState.connections.delete(connId);
                });
                
                AppState.traits.delete(traitId);
            }
        });
        
        AppState.selectedTraits.clear();
        this.updateStats();
        this.render();
    }
    
    selectAll() {
        AppState.traits.forEach(trait => {
            AppState.selectedTraits.add(trait.id);
        });
        this.render();

    setTool(tool) {
        AppState.currentTool = tool;
        
        // Update UI
        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.tool === tool);
        });
        
        // Handle tool actions
        if (tool === 'auto') {
            this.autoLayout();
        } else if (tool === 'clear') {
            this.clearSelection();
            this.cancelConnection();
        }
    }
    
    cancelConnection() {
        AppState.connectingTrait = null;
    }
    
    autoLayout() {
        const centerX = this.canvas.width / 2;
        const centerY = this.canvas.height / 2;
        const radius = Math.min(centerX, centerY) * 0.6;
        
        const traits = Array.from(AppState.traits.values());
        
        // Circular layout
        traits.forEach((trait, i) => {
            const angle = (i * 2 * Math.PI) / traits.length;
            trait.x = centerX + radius * Math.cos(angle);
            trait.y = centerY + radius * Math.sin(angle);
        });
        
        this.render();
        this.showToast('Network auto-arranged', 'info');
    }
    
    createInitialNetwork() {
        // Create initial demo traits
        const initialTraits = [
            this.createTrait(TRAIT_LIBRARY.immune[0], 200, 200),
            this.createTrait(TRAIT_LIBRARY.physiological[0], 400, 200),
            this.createTrait(TRAIT_LIBRARY.clinical[0], 300, 350),
            this.createTrait(TRAIT_LIBRARY.comorbid[0], 200, 500),
            this.createTrait(TRAIT_LIBRARY.biomarker[0], 400, 500)
        ];
        
        // Create initial connections
        setTimeout(() => {
            const traits = Array.from(AppState.traits.values());
            if (traits.length >= 3) {
                this.createConnection(traits[0], traits[1]);
                this.createConnection(traits[1], traits[2]);
                this.createConnection(traits[0], traits[3]);
            }
        }, 100);
    }
    
    getTraitAt(x, y) {
        for (const trait of AppState.traits.values()) {
            const dx = trait.x - x;
            const dy = trait.y - y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance < 25) {
                return trait;
            }
        }
        return null;
    }

    countByCategory(category) {
        return Array.from(AppState.traits.values())
            .filter(t => t.category === category).length;
    }
    
    calculateAverageEvidence() {
        const traits = Array.from(AppState.traits.values());
        if (traits.length === 0) return 0;
        
        const total = traits.reduce((sum, trait) => sum + trait.evidence, 0);
        return (total / traits.length).toFixed(1);
    }
    
    analyzeNetwork() {
        const stats = {
            traits: AppState.traits.size,
            connections: AppState.connections.size,
            density: (AppState.connections.size / (AppState.traits.size * (AppState.traits.size - 1) / 2)) * 100 || 0,
            avgSeverity: this.calculateAverage('severity'),
            avgConfidence: this.calculateAverage('confidence')
        };
        
        this.showToast(
            `Analysis: ${stats.traits} traits, ${stats.connections} connections, ` +
            `${stats.avgSeverity}% avg severity`,
            'info'
        );
        
        this.updateStats();
    }
    
    calculateAverage(property) {
        const traits = Array.from(AppState.traits.values());
        if (traits.length === 0) return 0;
        
        const total = traits.reduce((sum, trait) => sum + trait[property], 0);
        return Math.round(total / traits.length);
    }
    
    highlightCategory(category) {
        AppState.selectedTraits.clear();
        
        AppState.traits.forEach(trait => {
            if (trait.category === category) {
                AppState.selectedTraits.add(trait.id);
            }
        });
        
        this.render();
        this.showToast(`Highlighted ${this.countByCategory(category)} ${category} traits`, 'info');

    highlightHighSeverity() {
        AppState.selectedTraits.clear();
        
        const highSeverityTraits = Array.from(AppState.traits.values())
            .filter(t => t.severity > 70);
        
        highSeverityTraits.forEach(trait => {
            AppState.selectedTraits.add(trait.id);

        this.render();
        this.showToast(`Highlighted ${highSeverityTraits.length} high-severity traits`, 'info');

    suggestConnections() {
        const traits = Array.from(AppState.traits.values());
        if (traits.length < 2) return;
        
        // Find disconnected traits
        const disconnected = traits.filter(t => t.connections.size === 0);
        
        if (disconnected.length >= 2) {
            this.createConnection(disconnected[0], disconnected[1]);
            this.showToast('Suggested connection created', 'success');

    // ==================== RENDERING ====================
    
    startRenderLoop() {
        const render = () => {
            this.render();
            requestAnimationFrame(render);
        };
        requestAnimationFrame(render);
    }
    
    render() {
        const now = performance.now();
        if (now - this.lastRenderTime < 16) return; // ~60fps
        this.lastRenderTime = now;
        
        // Clear canvas
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        // Draw connections
        AppState.connections.forEach(connection => {
            const source = AppState.traits.get(connection.source);
            const target = AppState.traits.get(connection.target);
            
            if (source && target) {
                this.ctx.beginPath();
                this.ctx.moveTo(source.x, source.y);
                this.ctx.lineTo(target.x, target.y);
                this.ctx.strokeStyle = this.getConnectionColor(connection);
                this.ctx.lineWidth = 2;
                this.ctx.globalAlpha = 0.6;
                this.ctx.stroke();
                this.ctx.globalAlpha = 1;
                
                // Draw connection strength indicator
                const midX = (source.x + target.x) / 2;
                const midY = (source.y + target.y) / 2;
                
                this.ctx.beginPath();
                this.ctx.arc(midX, midY, 3, 0, Math.PI * 2);
                this.ctx.fillStyle = connection.strength > 75 ? '#10b981' : 
                                   connection.strength > 50 ? '#f59e0b' : '#ef4444';
                this.ctx.fill();
            }
        });
        
        // Draw connection preview
        if (AppState.connectingTrait) {
            const rect = this.canvas.getBoundingClientRect();
            const mouseX = AppState.lastMouseX - rect.left;
            const mouseY = AppState.lastMouseY - rect.top;
            
            this.ctx.beginPath();
            this.ctx.moveTo(AppState.connectingTrait.x, AppState.connectingTrait.y);
            this.ctx.lineTo(mouseX, mouseY);
            this.ctx.strokeStyle = 'var(--primary-blue)';
            this.ctx.lineWidth = 2;
            this.ctx.setLineDash([5, 3]);
            this.ctx.stroke();
            this.ctx.setLineDash([]);
        }
        
        // Draw traits
        AppState.traits.forEach(trait => {
            // Draw glow if selected
            if (AppState.selectedTraits.has(trait.id)) {
                this.ctx.beginPath();
                this.ctx.arc(trait.x, trait.y, 32, 0, Math.PI * 2);
                const gradient = this.ctx.createRadialGradient(
                    trait.x, trait.y, 25,
                    trait.x, trait.y, 32
                );
                gradient.addColorStop(0, trait.color + '80');
                gradient.addColorStop(1, trait.color + '00');
                this.ctx.fillStyle = gradient;
                this.ctx.fill();
            }
            
            // Draw trait circle
            this.ctx.beginPath();
            this.ctx.arc(trait.x, trait.y, 25, 0, Math.PI * 2);
            this.ctx.fillStyle = trait.color;
            this.ctx.fill();
            
            // Draw border if selected
            if (AppState.selectedTraits.has(trait.id)) {
                this.ctx.beginPath();
                this.ctx.arc(trait.x, trait.y, 25, 0, Math.PI * 2);
                this.ctx.strokeStyle = 'white';
                this.ctx.lineWidth = 2;
                this.ctx.stroke();
            }
            
            // Draw icon
            this.ctx.font = '14px FontAwesome';
            this.ctx.fillStyle = 'white';
            this.ctx.textAlign = 'center';
            this.ctx.textBaseline = 'middle';
            
            // Simple icon representation
            const icons = {
                'shield-virus': '🛡️',
                'lungs': '🫁',
                'stethoscope': '🩺',
                'heartbeat': '💓',
                'vial': '🧪',
                'pills': '💊'
            };
            
            const icon = icons[trait.icon.split('-')[1]] || '●';
            this.ctx.fillText(icon, trait.x, trait.y);
            
            // Draw evidence level indicator
            this.ctx.beginPath();
            this.ctx.arc(trait.x + 15, trait.y - 15, 6, 0, Math.PI * 2);
            this.ctx.fillStyle = this.getEvidenceColor(trait.evidence);
            this.ctx.fill();
        });
        
        // Draw connection count
        if (AppState.connectingTrait) {
            this.ctx.font = '12px Inter';
            this.ctx.fillStyle = 'var(--text-secondary)';
            this.ctx.textAlign = 'center';
            this.ctx.fillText(
                `Connecting from: ${AppState.connectingTrait.name}`,
                this.canvas.width / 2,
                20
            );
        }
    }
    
    getConnectionColor(connection) {
        if (connection.strength > 75) return '#10b981'; // Strong
        if (connection.strength > 50) return '#f59e0b'; // Moderate
        return '#ef4444'; // Weak
    }
    
    getEvidenceColor(level) {
        switch(level) {
            case 1: return '#fbbf24'; // Gold
            case 2: return '#a3a3a3'; // Silver
            case 3: return '#92400e'; // Bronze
            case 4: return '#6b7280'; // Gray
            default: return '#6b7280';
        }
    }

    importNetwork(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                
                // Clear current network
                AppState.traits.clear();
                AppState.connections.clear();
                AppState.selectedTraits.clear();
                
                // Load traits
                data.traits.forEach(traitData => {
                    const trait = {
                        id: traitData.id,
                        name: traitData.name,
                        category: traitData.category,
                        color: this.getCategoryColor(traitData.category),
                        icon: this.getCategoryIcon(traitData.category),
                        evidence: traitData.evidence || 3,
                        severity: traitData.severity || 50,
                        confidence: traitData.confidence || 70,
                        x: traitData.x,
                        y: traitData.y,
                        connections: new Set()
                    };
                    
                    AppState.traits.set(trait.id, trait);
                });
                
                // Load connections
                data.connections.forEach(connData => {
                    const connection = {
                        id: `${connData.source}-${connData.target}`,
                        source: connData.source,
                        target: connData.target,
                        strength: connData.strength || 50,
                        certainty: connData.certainty || 70
                    };
                    
                    AppState.connections.set(connection.id, connection);
                    
                    // Update trait connections
                    const sourceTrait = AppState.traits.get(connData.source);
                    const targetTrait = AppState.traits.get(connData.target);
                    if (sourceTrait) sourceTrait.connections.add(connection.id);
                    if (targetTrait) targetTrait.connections.add(connection.id);
                });
                
                this.updateStats();
                this.render();
                this.showToast('Network imported successfully', 'success');
                
            } catch (error) {
                this.showToast('Error importing network', 'error');
                console.error('Import error:', error);
            }
        };
        reader.readAsText(file);
    }
    
    getCategoryColor(category) {
        const colors = {
            immune: '#ef4444',
            physiological: '#10b981',
            clinical: '#f59e0b',
            comorbid: '#8b5cf6',
            biomarker: '#06b6d4',
            treatment: '#ec4899'
        };
        return colors[category] || '#6b7280';

    getCategoryIcon(category) {

            immune: 'fas fa-shield-virus',
            physiological: 'fas fa-lungs',
            clinical: 'fas fa-stethoscope',
            comorbid: 'fas fa-heartbeat',

            treatment: 'fas fa-pills'
        };
        return icons[category] || 'fas fa-circle';

    // ==================== ADVANCED ANALYSIS ====================
    
    calculateNetworkMetrics() {
        const traits = Array.from(AppState.traits.values());
        const connections = Array.from(AppState.connections.values());
        
        if (traits.length === 0) return null;
        
        const metrics = {
            // Basic counts
            traitCount: traits.length,
            connectionCount: connections.length,
            
            // Density metrics
            density: connections.length / (traits.length * (traits.length - 1) / 2) || 0,
            averageDegree: (connections.length * 2) / traits.length || 0,
            
            // Severity analysis
            averageSeverity: this.calculateAverage('severity'),
            highSeverityCount: traits.filter(t => t.severity > 70).length,
            criticalTraits: traits.filter(t => t.severity > 90).length,
            
            // Evidence quality
            averageEvidence: this.calculateAverageEvidence(),
            strongEvidenceCount: traits.filter(t => t.evidence <= 2).length,
            
            // Connection strength
            averageConnectionStrength: connections.reduce((sum, c) => sum + c.strength, 0) / connections.length || 0,
            strongConnections: connections.filter(c => c.strength > 75).length,
            
            // Category distribution
            categoryDistribution: {}
        };
        
        // Calculate category distribution
        traits.forEach(trait => {
            metrics.categoryDistribution[trait.category] = 
                (metrics.categoryDistribution[trait.category] || 0) + 1;
        });
        
        return metrics;
    }
    
    generateClinicalReport() {
        const metrics = this.calculateNetworkMetrics();
        if (!metrics) return;
        
        const report = `
            TRAITMAP CLINICAL REPORT
            ========================
            
            Network Overview:
            - Total Traits: ${metrics.traitCount}
            - Total Connections: ${metrics.connectionCount}
            - Network Density: ${(metrics.density * 100).toFixed(1)}%
            
            Clinical Severity:
            - Average Severity: ${metrics.averageSeverity}%
            - High Severity Traits: ${metrics.highSeverityCount}
            - Critical Traits: ${metrics.criticalTraits}
            
            Evidence Quality:
            - Average Evidence Level: ${metrics.averageEvidence}/4
            - Strong Evidence Traits: ${metrics.strongEvidenceCount}
            
            Connection Analysis:
            - Average Connection Strength: ${Math.round(metrics.averageConnectionStrength)}%
            - Strong Connections: ${metrics.strongConnections}
            
            Category Distribution:
            ${Object.entries(metrics.categoryDistribution)
                .map(([cat, count]) => `  - ${cat}: ${count} traits`)
                .join('\n')}
            
            Generated: ${new Date().toLocaleString()}
        `;
        
        // Create download
        const blob = new Blob([report], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `clinical-report-${new Date().toISOString().split('T')[0]}.txt`;
        a.click();
        
        this.showToast('Clinical report generated', 'success');
    }

    setupEnhancedConnections() {

        this.canvas.addEventListener('mousemove', (e) => {
            const rect = this.canvas.getBoundingClientRect();
            AppState.lastMouseX = e.clientX;
            AppState.lastMouseY = e.clientY;
        });
        
        // Double-click to edit connection
        this.canvas.addEventListener('dblclick', (e) => {
            const rect = this.canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Check if clicked on connection
            const connection = this.getConnectionAt(x, y);
            if (connection) {
                this.editConnection(connection);
            }
        });
    }
    
    getConnectionAt(x, y) {
        for (const connection of AppState.connections.values()) {
            const source = AppState.traits.get(connection.source);
            const target = AppState.traits.get(connection.target);
            
            if (source && target) {
                // Calculate distance from point to line
                const distance = this.pointToLineDistance(x, y, source, target);
                if (distance < 10) {
                    return connection;
                }
            }
        }
        return null;
    }
    
    pointToLineDistance(px, py, p1, p2) {
        const A = px - p1.x;
        const B = py - p1.y;
        const C = p2.x - p1.x;
        const D = p2.y - p1.y;
        
        const dot = A * C + B * D;
        const lenSq = C * C + D * D;
        let param = -1;
        
        if (lenSq !== 0) {
            param = dot / lenSq;
        }
        
        let xx, yy;
        
        if (param < 0) {
            xx = p1.x;
            yy = p1.y;
        } else if (param > 1) {
            xx = p2.x;
            yy = p2.y;
        } else {
            xx = p1.x + param * C;
            yy = p1.y + param * D;
        }
        
        const dx = px - xx;
        const dy = py - yy;
        return Math.sqrt(dx * dx + dy * dy);
    }
    
    editConnection(connection) {
        const source = AppState.traits.get(connection.source);
        const target = AppState.traits.get(connection.target);
        
        if (!source || !target) return;
        
        // Create edit modal
        const modal = document.createElement('div');
        modal.style.cssText = `
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            min-width: 300px;
            z-index: 2000;
        `;
        
        modal.innerHTML = `
            <h3 style="margin-bottom: 1rem;">Edit Connection</h3>
            <div style="margin-bottom: 1rem;">
                <div style="margin-bottom: 0.5rem;">
                    <label style="display: block; margin-bottom: 0.25rem; font-size: 0.875rem;">
                        ${source.name} → ${target.name}
                    </label>
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.25rem; font-size: 0.875rem;">
                        Strength: ${connection.strength}%
                    </label>
                    <input type="range" min="0" max="100" value="${connection.strength}" 
                           style="width: 100%;" id="strengthSlider">
                </div>
                <div style="display: flex; gap: 0.5rem;">
                    <button class="btn" onclick="this.closest('div').remove()" 
                            style="flex: 1;">Cancel</button>
                    <button class="btn btn-primary" onclick="app.updateConnectionStrength('${connection.id}', 
                            document.getElementById('strengthSlider').value); 
                            this.closest('div').remove()" style="flex: 1;">
                        Update
                    </button>
                </div>
            </div>
        `;
        
        document.body.appendChild(modal);
    }
    
    updateConnectionStrength(connectionId, strength) {
        const connection = AppState.connections.get(connectionId);
        if (connection) {
            connection.strength = parseInt(strength);
            this.render();
            this.showToast('Connection strength updated', 'success');
        }
    }
    
    // ==================== TREE FORMATION ====================
    
    arrangeAsTree() {
        const traits = Array.from(AppState.traits.values());
        if (traits.length === 0) return;
        
        // Find central trait (most connected)
        let centralTrait = traits[0];
        let maxConnections = 0;
        
        traits.forEach(trait => {
            if (trait.connections.size > maxConnections) {
                maxConnections = trait.connections.size;
                centralTrait = trait;
            }
        });
        
        // Position central trait in center
        const centerX = this.canvas.width / 2;
        const centerY = this.canvas.height / 2;
        centralTrait.x = centerX;
        centralTrait.y = centerY;
        
        // Position connected traits around central
        const connectedTraits = this.getConnectedTraits(centralTrait);
        const radius = 150;
        
        connectedTraits.forEach((trait, i) => {
            const angle = (i * 2 * Math.PI) / connectedTraits.length;
            trait.x = centerX + radius * Math.cos(angle);
            trait.y = centerY + radius * Math.sin(angle);
        });
        
        this.render();
        this.showToast('Arranged as tree structure', 'success');
    }
    
    getConnectedTraits(trait) {
        const connected = new Set();
        
        trait.connections.forEach(connId => {
            const connection = AppState.connections.get(connId);
            if (connection) {
                const otherId = connection.source === trait.id ? connection.target : connection.source;
                const otherTrait = AppState.traits.get(otherId);
                if (otherTrait) {
                    connected.add(otherTrait);
                }
            }
        });
        
        return Array.from(connected);
    }
}

// Initialize application
let app;

document.addEventListener('DOMContentLoaded', () => {
    // Hide loading screen
    setTimeout(() => {
        document.getElementById('loadingScreen').style.display = 'none';
        app = new TraitMapPro();
        window.app = app;
    }, 1000);
    
    // Add keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.key === 'e' && e.ctrlKey) {
            e.preventDefault();
            app.exportNetwork();
        } else if (e.key === 't' && e.ctrlKey) {
            e.preventDefault();
            app.arrangeAsTree();
        } else if (e.key === 'r' && e.ctrlKey) {
            e.preventDefault();
            app.generateClinicalReport();
        } else if (e.key === 'i' && e.ctrlKey && !e.shiftKey) {
            e.preventDefault();
            // Trigger file import
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    app.importNetwork(file);
                }
            };
            input.click();
        }
    });
    
    // Add import/export buttons
    const headerActions = document.querySelector('.header-actions');
    const exportBtn = document.createElement('button');
    exportBtn.className = 'btn';
    exportBtn.innerHTML = '<i class="fas fa-download"></i><span>Export</span>';
    exportBtn.onclick = () => app.exportNetwork();
    headerActions.insertBefore(exportBtn, headerActions.firstChild);
    
    const importBtn = document.createElement('button');
    importBtn.className = 'btn';
    importBtn.innerHTML = '<i class="fas fa-upload"></i><span>Import</span>';
    importBtn.onclick = () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                app.importNetwork(file);
            }
        };
        input.click();
    };
    headerActions.insertBefore(importBtn, headerActions.firstChild);
});
