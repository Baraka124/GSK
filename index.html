<!DOCTYPE html>
<html>
<head>
    <title>Database Test - Safe Version</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Testing Database Connection</h1>
    <div id="result">Loading...</div>
    
    <script>
        const SUPABASE_URL = 'https://timmylvmumneqhpkvcgb.supabase.co';
        
        // DO NOT USE SECRET KEY IN FRONTEND CODE!
        // Get your ANON/PUBLIC key from: 
        // https://app.supabase.com/project/timmylvmumneqhpkvcgb/settings/api
        const SUPABASE_KEY = 'YOUR_ANON_PUBLIC_KEY_HERE'; // Replace this!
        
        async function testConnection() {
            try {
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                
                // Test 1: List tables you have
                console.log('Testing connection to:', SUPABASE_URL);
                
                // Test each table that might exist
                const testResults = [];
                
                // Test diseases table
                try {
                    const { data: diseases, error: dError } = await supabase
                        .from('diseases')
                        .select('*')
                        .limit(2);
                    
                    testResults.push({
                        table: 'diseases',
                        exists: !dError,
                        error: dError?.message,
                        count: diseases?.length || 0
                    });
                } catch(e) {
                    testResults.push({ table: 'diseases', exists: false, error: e.message });
                }
                
                // Test treatable_traits table
                try {
                    const { data: traits, error: tError } = await supabase
                        .from('treatable_traits')
                        .select('*')
                        .limit(2);
                    
                    testResults.push({
                        table: 'treatable_traits',
                        exists: !tError,
                        error: tError?.message,
                        count: traits?.length || 0
                    });
                } catch(e) {
                    testResults.push({ table: 'treatable_traits', exists: false, error: e.message });
                }
                
                // Display results
                const resultDiv = document.getElementById('result');
                resultDiv.innerHTML = `
                    <h3>Connection Test Results</h3>
                    <p>URL: ${SUPABASE_URL}</p>
                    <div style="margin-top: 20px;">
                        ${testResults.map(r => `
                            <div style="margin: 10px; padding: 10px; background: ${r.exists ? '#d4edda' : '#f8d7da'}; color: #000;">
                                <strong>${r.table}</strong>: ${r.exists ? '✅ Accessible' : '❌ Error'}
                                ${r.count ? `<br>Records: ${r.count}` : ''}
                                ${r.error ? `<br>Error: ${r.error}` : ''}
                            </div>
                        `).join('')}
                    </div>
                    <p style="margin-top: 20px; color: red;">
                        <strong>IMPORTANT:</strong> Regenerate your secret key immediately! 
                        Never use service_role keys in frontend code.
                    </p>
                `;
                
                return testResults;
                
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <div style="color: red;">
                        <h3>Connection Failed</h3>
                        <p>Error: ${error.message}</p>
                        <p>Possible issues:</p>
                        <ul>
                            <li>Wrong API key type (use anon/public key, not secret)</li>
                            <li>CORS not configured in Supabase</li>
                            <li>Network issues</li>
                        </ul>
                    </div>
                `;
                return [];
            }
        }
        
        // Run test
        testConnection();
    </script>
</body>
</html>
