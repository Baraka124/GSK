<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interactive Airway AI Tree</title>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
body { margin:0; font-family:sans-serif; background:#f0f8ff; }
#root { width:100vw; height:100vh; overflow:hidden; }
.node circle { fill:#1A5F7A; cursor:pointer; }
.node text { fill:#fff; font-size:12px; text-anchor:middle; pointer-events:none; }
.link { fill:none; stroke:#2D9596; stroke-width:2px; }
.leaf-input { position:absolute; z-index:10; background:#fff; border:1px solid #ccc; padding:4px; border-radius:4px; }
.leaf { font-size:10px; fill:#ffcc00; cursor:pointer; }
.leaf:hover { text-decoration:underline; }
.controls { position:absolute; top:10px; left:10px; z-index:20; background:#fff; border:1px solid #ccc; padding:6px; border-radius:6px; }
.controls button { margin-right:6px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// SUPABASE CONFIG
// SUPABASE CONFIG
const SUPABASE_URL = "https://outubctwarknkajfprcr.supabase.co";
const SUPABASE_KEY = "sb_publishable_7k1KOcW8SxSl_vREzU4KFw_iT8VmeVV";
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


// DEFAULT TREE
const defaultTree = {
  name: "Airway Diseases",
  children: [
    { name: "Inflammatory Traits", children: [ { name: "Eosinophilic", children:[{name:"Predictive Analytics", leaves:[]} ] }, { name:"Neutrophilic", children:[{name:"Predictive Analytics", leaves:[]} ] } ] },
    { name: "Airflow Limitation", children: [ { name: "Bronchoconstriction", children:[{name:"Sensor Analysis", leaves:[]} ] }, { name:"Fixed Obstruction", children:[{name:"Treatment Optimization", leaves:[]} ] } ] },
    { name: "Exacerbation-Prone Traits", children: [ { name:"Frequent Exacerbations", children:[{name:"Predictive Analytics", leaves:[]} ] }, { name:"Infection Susceptibility", children:[{name:"Sensor Analysis", leaves:[]} ] } ] }
  ]
};

// TREE COMPONENT
function Tree() {
  const svgRef = useRef();
  const [data, setData] = useState(defaultTree);
  const [treeId, setTreeId] = useState(null);
  const [inputPos, setInputPos] = useState(null);
  const [inputValue, setInputValue] = useState('');
  const [currentNode, setCurrentNode] = useState(null);

  // LOAD TREE FROM SUPABASE
  useEffect(function() {
    async function loadTree() {
      let { data: rows, error } = await supabase.from("trees").select("*").order("created_at", {ascending:true}).limit(1);
      if (error) { console.error(error); return; }
      if (rows.length > 0) { setData(rows[0].data); setTreeId(rows[0].id); }
      else {
        let { data: inserted, error: insertError } = await supabase.from("trees").insert({name:"Airway Tree", data: defaultTree}).select().single();
        if (!insertError) { setData(inserted.data); setTreeId(inserted.id); }
      }
    }
    loadTree();
  }, []);

  // SAVE TREE TO SUPABASE
  useEffect(function() {
    if (!treeId) return;
    async function saveTree() {
      let { error } = await supabase.from("trees").update({data}).eq("id", treeId);
      if (error) console.error(error);
    }
    saveTree();
    renderTree();
  }, [data, treeId]);

  // ADD LEAF
  function handleAddLeaf(node, x, y) {
    setCurrentNode(node);
    setInputPos({x:x, y:y});
    setInputValue('');
  }

  // SUBMIT LEAF
  function handleSubmitLeaf() {
    if (!inputValue.trim()) return;
    let newData = JSON.parse(JSON.stringify(data));
    function addLeaf(node) {
      if (node === currentNode) { node.leaves = node.leaves||[]; node.leaves.push(inputValue.trim()); }
      else if (node.children) node.children.forEach(addLeaf);
    }
    addLeaf(newData);
    setData(newData);
    setInputPos(null);
    setCurrentNode(null);
  }

  // EDIT LEAF
  function handleEditLeaf(node, index) {
    let newText = prompt("Edit leaf:", node.leaves[index]);
    if (newText != null && newText.trim() !== "") {
      let newData = JSON.parse(JSON.stringify(data));
      function editLeaf(n) { if(n===node) n.leaves[index]=newText.trim(); else if(n.children) n.children.forEach(editLeaf); }
      editLeaf(newData);
      setData(newData);
    }
  }

  // DELETE LEAF
  function handleDeleteLeaf(node, index) {
    if (!confirm("Delete this leaf?")) return;
    let newData = JSON.parse(JSON.stringify(data));
    function delLeaf(n) { if(n===node) n.leaves.splice(index,1); else if(n.children) n.children.forEach(delLeaf); }
    delLeaf(newData);
    setData(newData);
  }

  // RENDER TREE
  function renderTree() {
    const svg = d3.select(svgRef.current);
    svg.selectAll("*").remove();
    const width = svgRef.current.clientWidth;
    const height = svgRef.current.clientHeight;
    const root = d3.hierarchy(data, function(d){ return d.children; });
    const treeLayout = d3.tree().size([height-50,width-200]);
    treeLayout(root);

    // LINKS
    svg.selectAll(".link").data(root.links()).enter()
      .append("path").attr("class","link").attr("d", d3.linkHorizontal().x(function(d){return d.y+100}).y(function(d){return d.x}));

    // NODES
    const nodeGroup = svg.selectAll(".node").data(root.descendants()).enter()
      .append("g").attr("class","node").attr("transform", function(d){return "translate("+ (d.y+100) + "," + d.x + ")"; });

    nodeGroup.append("circle").attr("r",18).on("click", function(event,d){handleAddLeaf(d.data,d.y+100,d.x);});
    nodeGroup.append("text").attr("dy",4).text(function(d){return d.data.name;});

    // LEAVES
    nodeGroup.each(function(d){
      if(d.data.leaves){
        d3.select(this).selectAll(".leaf").data(d.data.leaves).enter()
          .append("text").attr("class","leaf")
          .attr("dy", function(leaf,i){ return 24 + i*16; })
          .attr("text-anchor","middle")
          .text(function(leaf){return leaf;})
          .on("click", function(event,leaf,i){ handleEditLeaf(d.data,i); })
          .on("contextmenu", function(event,leaf,i){ event.preventDefault(); handleDeleteLeaf(d.data,i); });
      }
    });
  }

  // CONTROLS
  return React.createElement(
    React.Fragment,
    null,
    React.createElement("div", {className:"controls"},
      React.createElement("button", {onClick:function(){setData(JSON.parse(JSON.stringify(defaultTree)));}}, "Reset Tree")
    ),
    React.createElement("svg", {ref:svgRef, width:"100%", height:"100%"}),
    inputPos ? React.createElement("div", {className:"leaf-input", style:{left: inputPos.x+"px", top: inputPos.y+"px"}},
      React.createElement("input", {type:"text", placeholder:"Add leaf...", value: inputValue,
        onChange:function(e){setInputValue(e.target.value);},
        onKeyDown:function(e){ if(e.key==="Enter") handleSubmitLeaf(); }
      }),
      React.createElement("button", {onClick:handleSubmitLeaf}, "Add")
    ) : null
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Tree));
</script>
</body>
</html>
