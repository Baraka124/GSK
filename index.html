<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interactive Airway AI Tree</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
  body { margin:0; font-family:sans-serif; background:#f0f8ff; }
  #root { width:100vw; height:100vh; overflow:hidden; }
  .node circle { fill:#1A5F7A; cursor:pointer; }
  .node text { fill:#fff; font-size:12px; text-anchor:middle; pointer-events:none; }
  .link { fill:none; stroke:#2D9596; stroke-width:2px; }
  .leaf { font-size:10px; fill:#ffcc00; cursor:pointer; }
  .controls {
    position:absolute;
    top:10px;
    left:10px;
    background:#fff;
    padding:8px;
    border-radius:6px;
    border:1px solid #ccc;
    z-index:10;
  }
</style>
</head>

<body>
<div id="root"></div>

<script>
const e = React.createElement;
const { useState, useEffect, useRef } = React;

const defaultTree = {
  name: "Airway Diseases",
  children: [
    {
      name: "Inflammatory Traits",
      children: [
        { name: "Eosinophilic", leaves: [] },
        { name: "Neutrophilic", leaves: [] }
      ]
    },
    {
      name: "Airflow Limitation",
      children: [
        { name: "Bronchoconstriction", leaves: [] },
        { name: "Fixed Obstruction", leaves: [] }
      ]
    }
  ]
};

function Tree() {
  const svgRef = useRef(null);
  const [data, setData] = useState(() => {
    const saved = localStorage.getItem("airwayTree");
    return saved ? JSON.parse(saved) : defaultTree;
  });

  useEffect(() => {
    localStorage.setItem("airwayTree", JSON.stringify(data));
    renderTree();
  }, [data]);

  function renderTree() {
    const svg = d3.select(svgRef.current);
    svg.selectAll("*").remove();

    const width = window.innerWidth;
    const height = window.innerHeight;

    const root = d3.hierarchy(data, d => d.children);
    d3.tree().size([height - 50, width - 200])(root);

    svg.selectAll(".link")
      .data(root.links())
      .enter()
      .append("path")
      .attr("class","link")
      .attr("d", d3.linkHorizontal()
        .x(d => d.y + 100)
        .y(d => d.x)
      );

    const node = svg.selectAll(".node")
      .data(root.descendants())
      .enter()
      .append("g")
      .attr("class","node")
      .attr("transform", d => `translate(${d.y+100},${d.x})`);

    node.append("circle").attr("r",18);
    node.append("text").attr("dy",4).text(d => d.data.name);
  }

  return e(
    React.Fragment,
    null,
    e("div", { className:"controls" },
      e("strong", null, "Interactive Airway AI Tree")
    ),
    e("svg", { ref: svgRef, width:"100%", height:"100%" })
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(Tree));
</script>

</body>
</html>
