<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAITMAP - Clinical Intelligence Platform</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #001428 0%, #00214d 100%);
            color: white;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Loading Screen */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #001428 0%, #00214d 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-content {
            text-align: center;
            padding: 2rem;
        }

        .loading-logo {
            font-size: 4rem;
            color: #0066ff;
            margin-bottom: 1rem;
        }

        .loading-title {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #0066ff, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .loading-progress {
            width: 300px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin: 2rem auto;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #0066ff, #00ccff);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Main App */
        #appContainer {
            display: none;
            height: 100vh;
            padding-top: 60px;
        }

        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(10, 25, 60, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #0066ff, #9966ff);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-text h1 {
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, #0066ff, white);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #0066ff, #4d94ff);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #4d94ff, #80b3ff);
            box-shadow: 0 4px 20px rgba(0, 102, 255, 0.3);
        }

        /* Main Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            height: calc(100vh - 60px);
        }

        /* Sidebar */
        .sidebar {
            background: rgba(10, 25, 60, 0.9);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem;
            overflow-y: auto;
        }

        .sidebar-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #80b3ff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .trait-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .trait-item {
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            cursor: grab;
            transition: all 0.3s ease;
        }

        .trait-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(4px);
        }

        .trait-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .trait-desc {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
        }

        /* Canvas */
        .canvas-container {
            position: relative;
            overflow: hidden;
            background: rgba(5, 15, 40, 0.8);
        }

        #networkCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Tools */
        .tools {
            position: absolute;
            top: 1rem;
            left: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            background: rgba(10, 25, 60, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 0.5rem;
        }

        .tool-btn {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .tool-btn.active {
            background: #0066ff;
            border-color: #0066ff;
        }

        /* Insights Panel */
        .insights-panel {
            background: rgba(10, 25, 60, 0.9);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem;
            overflow-y: auto;
        }

        .insight-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .insight-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #80b3ff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .slider-container {
            margin: 1rem 0;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #0066ff;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen">
        <div class="loading-content">
            <div class="loading-logo">
                <i class="fas fa-brain"></i>
            </div>
            <h1 class="loading-title">TRAITMAP</h1>
            <p style="color: rgba(255, 255, 255, 0.7); margin-bottom: 2rem;">
                Clinical Intelligence Platform
            </p>
            <div class="loading-progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <p id="loadingMessage" style="color: #80b3ff; font-size: 0.9rem;">
                Initializing...
            </p>
        </div>
    </div>

    <!-- Main App -->
    <div id="appContainer">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-network-wired"></i>
                </div>
                <div class="logo-text">
                    <h1>TRAITMAP</h1>
                </div>
            </div>
            <div class="controls">
                <button class="btn" id="importBtn">
                    <i class="fas fa-upload"></i>
                    Import
                </button>
                <button class="btn" id="saveBtn">
                    <i class="fas fa-save"></i>
                    Save
                </button>
                <button class="btn btn-primary" id="simulateBtn">
                    <i class="fas fa-play"></i>
                    Simulate
                </button>
            </div>
        </header>

        <!-- Main Layout -->
        <main class="main-layout">
            <!-- Left Sidebar - Trait Library -->
            <aside class="sidebar">
                <div class="sidebar-title">
                    <i class="fas fa-shapes"></i>
                    Clinical Traits Library
                </div>
                <div class="trait-list" id="traitLibrary">
                    <!-- Traits will be loaded here -->
                </div>
            </aside>

            <!-- Canvas -->
            <section class="canvas-container">
                <svg id="networkCanvas"></svg>
                
                <div class="tools">
                    <button class="tool-btn active" data-tool="select">
                        <i class="fas fa-mouse-pointer"></i>
                    </button>
                    <button class="tool-btn" data-tool="connect">
                        <i class="fas fa-link"></i>
                    </button>
                    <button class="tool-btn" data-tool="hand">
                        <i class="fas fa-hand-paper"></i>
                    </button>
                    <button class="tool-btn" data-tool="center">
                        <i class="fas fa-crosshairs"></i>
                    </button>
                </div>
            </section>

            <!-- Right Panel - Insights -->
            <aside class="insights-panel">
                <div class="insight-card">
                    <div class="insight-title">
                        <i class="fas fa-sliders-h"></i>
                        Selected Trait Properties
                    </div>
                    <div id="propertiesContent">
                        <p style="color: rgba(255, 255, 255, 0.7); text-align: center; padding: 2rem;">
                            Select a trait to view properties
                        </p>
                    </div>
                </div>
                
                <div class="insight-card">
                    <div class="insight-title">
                        <i class="fas fa-chart-network"></i>
                        Network Stats
                    </div>
                    <div id="networkStats">
                        <p>Traits: <span id="traitCount">0</span></p>
                        <p>Connections: <span id="connectionCount">0</span></p>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <script>
        // ============================================
        // SIMPLE, ERROR-FREE IMPLEMENTATION
        // ============================================

        // 1. LOADING SEQUENCE
        document.addEventListener('DOMContentLoaded', function() {
            let progress = 0;
            const progressBar = document.getElementById('progressBar');
            const loadingMessage = document.getElementById('loadingMessage');
            const messages = [
                "Loading interface...",
                "Initializing engine...",
                "Preparing data...",
                "Ready!"
            ];
            
            const interval = setInterval(() => {
                progress += 25;
                progressBar.style.width = `${progress}%`;
                loadingMessage.textContent = messages[progress / 25 - 1];
                
                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        document.getElementById('loadingScreen').style.display = 'none';
                        document.getElementById('appContainer').style.display = 'block';
                        initializeApp();
                    }, 500);
                }
            }, 500);
        });

        // 2. CORE MODELS
        class Trait {
            constructor(id, name, category, description, color) {
                this.id = id;
                this.name = name;
                this.category = category;
                this.description = description;
                this.color = color;
                this.x = 0;
                this.y = 0;
                this.size = 40;
                this.severity = 50;
                this.confidence = 80;
                this.selected = false;
            }
        }

        class Connection {
            constructor(id, sourceId, targetId, strength) {
                this.id = id;
                this.sourceId = sourceId;
                this.targetId = targetId;
                this.strength = strength;
                this.color = '#4d94ff';
            }
        }

        // 3. APP STATE
        class AppState {
            constructor() {
                this.traits = [];
                this.connections = [];
                this.selectedTrait = null;
                this.currentTool = 'select';
            }

            addTrait(trait) {
                trait.x = window.innerWidth / 2 + (Math.random() - 0.5) * 200;
                trait.y = window.innerHeight / 2 + (Math.random() - 0.5) * 200;
                this.traits.push(trait);
                return trait;
            }

            addConnection(sourceId, targetId) {
                const connection = new Connection(
                    `conn-${Date.now()}`,
                    sourceId,
                    targetId,
                    50 + Math.random() * 50
                );
                this.connections.push(connection);
                return connection;
            }

            getTrait(id) {
                return this.traits.find(t => t.id === id);
            }

            removeTrait(id) {
                this.traits = this.traits.filter(t => t.id !== id);
                this.connections = this.connections.filter(c => 
                    c.sourceId !== id && c.targetId !== id
                );
                if (this.selectedTrait?.id === id) {
                    this.selectedTrait = null;
                }
            }
        }

        // 4. VISUALIZATION
        class Visualizer {
            constructor() {
                this.svg = d3.select('#networkCanvas')
                    .attr('width', window.innerWidth - 600)
                    .attr('height', window.innerHeight - 60);
                
                this.connectionsGroup = this.svg.append('g').attr('class', 'connections');
                this.traitsGroup = this.svg.append('g').attr('class', 'traits');
                
                this.simulation = d3.forceSimulation()
                    .force('link', d3.forceLink().id(d => d.id).distance(100))
                    .force('charge', d3.forceManyBody().strength(-200))
                    .force('center', d3.forceCenter(
                        (window.innerWidth - 600) / 2,
                        (window.innerHeight - 60) / 2
                    ))
                    .on('tick', () => this.tick());
                
                this.setupZoom();
                this.setupResize();
            }

            setupZoom() {
                const zoom = d3.zoom()
                    .scaleExtent([0.1, 4])
                    .on('zoom', (event) => {
                        this.traitsGroup.attr('transform', event.transform);
                        this.connectionsGroup.attr('transform', event.transform);
                    });
                
                this.svg.call(zoom);
            }

            setupResize() {
                window.addEventListener('resize', () => {
                    this.svg
                        .attr('width', window.innerWidth - 600)
                        .attr('height', window.innerHeight - 60);
                    
                    this.simulation.force('center', d3.forceCenter(
                        (window.innerWidth - 600) / 2,
                        (window.innerHeight - 60) / 2
                    ));
                    this.simulation.alpha(0.3).restart();
                });
            }

            update(state) {
                this.updateTraits(state.traits);
                this.updateConnections(state.connections, state.traits);
                this.updateSimulation(state.traits, state.connections);
            }

            updateTraits(traits) {
                const nodes = this.traitsGroup
                    .selectAll('.trait')
                    .data(traits, d => d.id);

                // Remove old
                nodes.exit()
                    .transition()
                    .duration(300)
                    .style('opacity', 0)
                    .remove();

                // Add new
                const nodesEnter = nodes.enter()
                    .append('g')
                    .attr('class', 'trait')
                    .attr('transform', d => `translate(${d.x}, ${d.y})`)
                    .style('opacity', 0)
                    .call(d3.drag()
                        .on('start', (event, d) => this.dragStarted(event, d))
                        .on('drag', (event, d) => this.dragged(event, d))
                        .on('end', (event, d) => this.dragEnded(event, d)));

                // Add circle
                nodesEnter.append('circle')
                    .attr('r', d => d.size)
                    .attr('fill', d => d.color)
                    .attr('stroke', d => d.selected ? 'white' : 'rgba(255,255,255,0.3)')
                    .attr('stroke-width', d => d.selected ? 3 : 1);

                // Add text
                nodesEnter.append('text')
                    .attr('text-anchor', 'middle')
                    .attr('dy', d => d.size + 15)
                    .attr('fill', 'white')
                    .attr('font-size', '10px')
                    .attr('font-weight', '600')
                    .text(d => d.name);

                // Fade in
                nodesEnter.transition()
                    .duration(300)
                    .style('opacity', 1);

                // Update existing
                const allNodes = nodes.merge(nodesEnter);
                
                allNodes.on('click', (event, d) => {
                    event.stopPropagation();
                    app.onTraitClick(d);
                });

                allNodes.select('circle')
                    .attr('stroke', d => d.selected ? 'white' : 'rgba(255,255,255,0.3)')
                    .attr('stroke-width', d => d.selected ? 3 : 1);
            }

            updateConnections(connections, traits) {
                // Filter out invalid connections
                const validConnections = connections.filter(conn => {
                    const source = traits.find(t => t.id === conn.sourceId);
                    const target = traits.find(t => t.id === conn.targetId);
                    return source && target;
                });

                const links = this.connectionsGroup
                    .selectAll('.connection')
                    .data(validConnections, d => d.id);

                // Remove old
                links.exit()
                    .transition()
                    .duration(300)
                    .style('opacity', 0)
                    .remove();

                // Add new
                const linksEnter = links.enter()
                    .append('line')
                    .attr('class', 'connection')
                    .attr('stroke', d => d.color)
                    .attr('stroke-width', 2)
                    .attr('stroke-opacity', 0.7)
                    .style('opacity', 0);

                // Fade in
                linksEnter.transition()
                    .duration(300)
                    .style('opacity', 0.7);
            }

            updateSimulation(traits, connections) {
                this.simulation.nodes(traits);
                this.simulation.force('link').links(connections);
                this.simulation.alpha(0.3).restart();
            }

            tick() {
                // Update connection positions
                this.connectionsGroup.selectAll('.connection')
                    .attr('x1', d => {
                        const source = app.state.getTrait(d.sourceId);
                        return source ? source.x : 0;
                    })
                    .attr('y1', d => {
                        const source = app.state.getTrait(d.sourceId);
                        return source ? source.y : 0;
                    })
                    .attr('x2', d => {
                        const target = app.state.getTrait(d.targetId);
                        return target ? target.x : 0;
                    })
                    .attr('y2', d => {
                        const target = app.state.getTrait(d.targetId);
                        return target ? target.y : 0;
                    });

                // Update trait positions
                this.traitsGroup.selectAll('.trait')
                    .attr('transform', d => `translate(${d.x}, ${d.y})`);
            }

            dragStarted(event, d) {
                if (!event.active) this.simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }

            dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }

            dragEnded(event, d) {
                if (!event.active) this.simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }
        }

        // 5. MAIN APP
        class App {
            constructor() {
                this.state = new AppState();
                this.visualizer = new Visualizer();
                this.isConnecting = false;
                this.connectionStart = null;
                
                this.initLibrary();
                this.initEvents();
                this.createDemoData();
            }

            initLibrary() {
                const library = document.getElementById('traitLibrary');
                const traits = [
                    new Trait('t1', 'Eosinophilic Inflammation', 'immune',
                        'Type-2 inflammation driving asthma severity', '#ff3366'),
                    new Trait('t2', 'Airflow Limitation', 'physiological',
                        'Obstructive pattern with reduced FEV1', '#00cc88'),
                    new Trait('t3', 'Cough Sensitivity', 'clinical',
                        'Heightened cough reflex', '#ffaa00'),
                    new Trait('t4', 'Bronchial Reactivity', 'physiological',
                        'Exaggerated response to triggers', '#9966ff'),
                    new Trait('t5', 'Sleep Disturbance', 'clinical',
                        'Nocturnal symptoms', '#00ccff')
                ];

                traits.forEach(trait => {
                    const div = document.createElement('div');
                    div.className = 'trait-item';
                    div.draggable = true;
                    div.innerHTML = `
                        <div class="trait-name">${trait.name}</div>
                        <div class="trait-desc">${trait.description}</div>
                    `;
                    
                    div.addEventListener('dragstart', (e) => {
                        e.dataTransfer.setData('text/plain', JSON.stringify(trait));
                        div.style.opacity = '0.5';
                    });
                    
                    div.addEventListener('dragend', () => {
                        div.style.opacity = '1';
                    });
                    
                    library.appendChild(div);
                });
            }

            initEvents() {
                // Canvas click
                this.visualizer.svg.on('click', () => {
                    this.state.traits.forEach(t => t.selected = false);
                    this.state.selectedTrait = null;
                    this.update();
                    this.updateProperties();
                });

                // Drop trait on canvas
                this.visualizer.svg.on('dragover', (e) => {
                    e.preventDefault();
                });

                this.visualizer.svg.on('drop', (e) => {
                    e.preventDefault();
                    try {
                        const data = JSON.parse(e.dataTransfer.getData('text/plain'));
                        const trait = new Trait(
                            `${data.id}-${Date.now()}`,
                            data.name,
                            data.category,
                            data.description,
                            data.color
                        );
                        this.state.addTrait(trait);
                        this.update();
                    } catch (err) {
                        console.error('Drop error:', err);
                    }
                });

                // Tool buttons
                document.querySelectorAll('.tool-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.tool-btn').forEach(b => 
                            b.classList.remove('active'));
                        btn.classList.add('active');
                        this.state.currentTool = btn.dataset.tool;
                        
                        if (this.state.currentTool === 'center') {
                            this.visualizer.svg.transition()
                                .duration(500)
                                .call(this.visualizer.svg.select('.zoom').transform, 
                                      d3.zoomIdentity);
                        }
                    });
                });

                // Action buttons
                document.getElementById('simulateBtn').addEventListener('click', () => {
                    alert('Simulation would run here!');
                });

                document.getElementById('saveBtn').addEventListener('click', () => {
                    alert('Session saved!');
                });
            }

            createDemoData() {
                // Add demo traits
                const traits = [
                    new Trait('demo1', 'Eosinophilic Inflammation', 'immune',
                        'Type-2 inflammation', '#ff3366'),
                    new Trait('demo2', 'Airflow Limitation', 'physiological',
                        'Obstructive pattern', '#00cc88'),
                    new Trait('demo3', 'Cough Sensitivity', 'clinical',
                        'Heightened reflex', '#ffaa00')
                ];

                traits.forEach(trait => {
                    this.state.addTrait(trait);
                });

                // Add demo connections
                this.state.addConnection('demo1', 'demo2');
                this.state.addConnection('demo2', 'demo3');

                this.update();
            }

            onTraitClick(trait) {
                if (this.state.currentTool === 'connect') {
                    if (!this.isConnecting) {
                        this.connectionStart = trait;
                        this.isConnecting = true;
                        trait.selected = true;
                        this.update();
                        alert(`Connecting from ${trait.name}. Click target trait.`);
                    } else {
                        if (this.connectionStart.id !== trait.id) {
                            this.state.addConnection(this.connectionStart.id, trait.id);
                            this.connectionStart.selected = false;
                            this.connectionStart = null;
                            this.isConnecting = false;
                            this.update();
                            alert(`Connected ${this.connectionStart?.name} to ${trait.name}`);
                        }
                    }
                } else {
                    // Select trait
                    this.state.traits.forEach(t => t.selected = false);
                    trait.selected = true;
                    this.state.selectedTrait = trait;
                    this.update();
                    this.updateProperties();
                }
            }

            update() {
                this.visualizer.update(this.state);
                this.updateStats();
            }

            updateProperties() {
                const content = document.getElementById('propertiesContent');
                const trait = this.state.selectedTrait;
                
                if (!trait) {
                    content.innerHTML = `
                        <p style="color: rgba(255, 255, 255, 0.7); text-align: center; padding: 2rem;">
                            Select a trait to view properties
                        </p>
                    `;
                    return;
                }
                
                content.innerHTML = `
                    <div style="margin-bottom: 1rem;">
                        <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem;">
                            <div style="width: 40px; height: 40px; background: ${trait.color}; border-radius: 8px;"></div>
                            <div>
                                <h3 style="font-weight: 700;">${trait.name}</h3>
                                <p style="font-size: 0.9rem; color: rgba(255, 255, 255, 0.7);">${trait.category}</p>
                            </div>
                        </div>
                        <p style="font-size: 0.9rem; margin-bottom: 1rem;">${trait.description}</p>
                    </div>
                    
                    <div class="slider-container">
                        <div class="slider-label">
                            <span>Severity</span>
                            <span>${trait.severity}%</span>
                        </div>
                        <input type="range" min="0" max="100" value="${trait.severity}" 
                               oninput="app.updateTraitSeverity(${trait.severity}, this.value)">
                    </div>
                    
                    <div class="slider-container">
                        <div class="slider-label">
                            <span>Confidence</span>
                            <span>${trait.confidence}%</span>
                        </div>
                        <input type="range" min="0" max="100" value="${trait.confidence}"
                               oninput="app.updateTraitConfidence(${trait.confidence}, this.value)">
                    </div>
                    
                    <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                        <button class="btn" style="flex: 1;" onclick="app.centerOnTrait('${trait.id}')">
                            <i class="fas fa-crosshairs"></i> Center
                        </button>
                        <button class="btn" style="flex: 1; background: rgba(255, 51, 102, 0.2);" 
                                onclick="app.removeTrait('${trait.id}')">
                            <i class="fas fa-trash"></i> Remove
                        </button>
                    </div>
                `;
            }

            updateTraitSeverity(oldValue, newValue) {
                if (this.state.selectedTrait) {
                    this.state.selectedTrait.severity = parseInt(newValue);
                    this.update();
                }
            }

            updateTraitConfidence(oldValue, newValue) {
                if (this.state.selectedTrait) {
                    this.state.selectedTrait.confidence = parseInt(newValue);
                    this.update();
                }
            }

            centerOnTrait(traitId) {
                const trait = this.state.getTrait(traitId);
                if (trait) {
                    const transform = d3.zoomIdentity
                        .translate(
                            (window.innerWidth - 600) / 2 - trait.x,
                            (window.innerHeight - 60) / 2 - trait.y
                        )
                        .scale(1.5);
                    
                    this.visualizer.svg.transition()
                        .duration(1000)
                        .call(this.visualizer.svg.select('.zoom').transform, transform);
                }
            }

            removeTrait(traitId) {
                this.state.removeTrait(traitId);
                this.update();
                this.updateProperties();
            }

            updateStats() {
                document.getElementById('traitCount').textContent = this.state.traits.length;
                document.getElementById('connectionCount').textContent = this.state.connections.length;
            }
        }

        // 6. INITIALIZE
        let app;
        
        function initializeApp() {
            app = new App();
            window.app = app; // Make accessible for inline handlers
        }
    </script>
</body>
</html>
