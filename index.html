<!DOCTYPE html>
<html>
<head>
    <title>Check Database Schema</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="result" style="padding: 20px; font-family: Arial;"></div>
    
    <script>
        async function checkDatabase() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<h2>Checking database schema...</h2>';
            
            try {
                // Use the URL but NOT the secret key
                const supabaseUrl = 'https://timmylvmumneqhpkvcgb.supabase.co';
                
                // First, let's see if we can even connect with ANY key
                resultDiv.innerHTML += '<p>Trying to connect to Supabase...</p>';
                
                // Try to fetch the OpenAPI schema (no key needed)
                try {
                    const response = await fetch(`${supabaseUrl}/rest/v1/`, {
                        headers: {
                            'apikey': 'any_key_will_work_for_schema'
                        }
                    });
                    
                    if (response.ok) {
                        resultDiv.innerHTML += '<p style="color: green;">✅ Supabase project is accessible</p>';
                        
                        // Now check what tables might exist
                        const tablesToCheck = [
                            'diseases', 'treatable_traits', 'disease_traits', 
                            'trait_networks', 'patients', 'treatments'
                        ];
                        
                        for (const table of tablesToCheck) {
                            try {
                                const tableResponse = await fetch(`${supabaseUrl}/rest/v1/${table}?limit=0`, {
                                    headers: {
                                        'apikey': 'any_key',
                                        'Authorization': 'Bearer any_key'
                                    }
                                });
                                
                                const status = tableResponse.status;
                                if (status === 200) {
                                    resultDiv.innerHTML += `<p style="color: green;">✅ Table "${table}" exists</p>`;
                                } else if (status === 401) {
                                    resultDiv.innerHTML += `<p style="color: orange;">🔒 Table "${table}" exists but needs valid key</p>`;
                                } else if (status === 404) {
                                    resultDiv.innerHTML += `<p style="color: red;">❌ Table "${table}" does not exist</p>`;
                                }
                            } catch (e) {
                                resultDiv.innerHTML += `<p style="color: gray;">❓ Table "${table}" - Could not check</p>`;
                            }
                        }
                        
                    } else {
                        resultDiv.innerHTML += `<p style="color: red;">❌ Cannot access Supabase (Status: ${response.status})</p>`;
                    }
                } catch (fetchError) {
                    resultDiv.innerHTML += `<p style="color: red;">❌ Network error: ${fetchError.message}</p>`;
                }
                
                // Add security warning
                resultDiv.innerHTML += `
                    <div style="background: #fff3cd; border: 1px solid #ffeaa7; padding: 15px; margin-top: 20px;">
                        <h3 style="color: #856404;">⚠️ CRITICAL SECURITY ALERT</h3>
                        <p>You shared your SECRET SERVICE ROLE KEY in the chat:</p>
                        <code style="background: #f8d7da; padding: 5px; display: block; margin: 10px 0;">
                            sb_secret_rs5K0cw_tPMJr2PsQFprUQ_uHjcbc7W
                        </code>
                        <p><strong>IMMEDIATE ACTION REQUIRED:</strong></p>
                        <ol>
                            <li>Go to Supabase Dashboard NOW</li>
                            <li>Navigate to: Project Settings → API</li>
                            <li>Click "Regenerate" next to service_role key</li>
                            <li>Use the ANON/PUBLIC key for frontend code</li>
                        </ol>
                    </div>
                `;
                
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
        
        checkDatabase();
    </script>
</body>
</html>
