<!DOCTYPE html>
<html>
<head>
    <title>Database Test</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Testing Supabase Connection</h1>
    <div id="result">Testing...</div>
    
    <script>
        // TRY BOTH URLs
        const URL1 = 'https://xwcpdmmnetbkybvwzqhi.supabase.co';
        const URL2 = 'https://timmylvmumneqhpkvcgb.supabase.co';
        const KEY = 'sb_publishable_0l8CRvQcizRJF13mdaFF9Q_cZpeuWL_';
        
        async function testConnection(url) {
            try {
                const supabase = window.supabase.createClient(url, KEY);
                
                // Test 1: Check if we can connect
                const { data: test1, error: err1 } = await supabase
                    .from('diseases')
                    .select('count')
                    .limit(1);
                
                // Test 2: Try to get table list
                const { data: test2, error: err2 } = await supabase
                    .from('diseases')
                    .select('*')
                    .limit(5);
                
                return {
                    success: !err1 && !err2,
                    url: url,
                    error1: err1?.message,
                    error2: err2?.message,
                    data: test2
                };
                
            } catch (error) {
                return {
                    success: false,
                    url: url,
                    error: error.message
                };
            }
        }
        
        async function runTests() {
            const results = [];
            
            // Test first URL
            results.push(await testConnection(URL1));
            
            // Test second URL
            results.push(await testConnection(URL2));
            
            // Display results
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = results.map(r => `
                <div style="margin: 20px; padding: 20px; border: 1px solid #ccc;">
                    <h3>Testing URL: ${r.url}</h3>
                    <p>Success: ${r.success ? '✅' : '❌'}</p>
                    ${r.error1 ? `<p>Error 1: ${r.error1}</p>` : ''}
                    ${r.error2 ? `<p>Error 2: ${r.error2}</p>` : ''}
                    ${r.data ? `<p>Data sample: ${JSON.stringify(r.data)}</p>` : ''}
                </div>
            `).join('');
        }
        
        runTests();
    </script>
</body>
</html>
