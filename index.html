        // ====== DATABASE FUNCTIONS ======
        async function initializeDatabase() {
            try {
                STATE.supabase = window.supabase.createClient(
                    CONFIG.SUPABASE_URL,
                    CONFIG.SUPABASE_KEY
                );
                
                // Test connection with a simple query
                const { data, error } = await STATE.supabase
                    .from('diseases')
                    .select('id, disease_name')
                    .limit(1);
                
                if (error) {
                    // If RLS error, provide helpful message
                    if (error.code === '42501') {
                        throw new Error('RLS policies blocking access. Run SQL: CREATE POLICY "Allow public read" ON diseases FOR SELECT USING (true);');
                    }
                    throw new Error(`Database: ${error.message}`);
                }
                
                console.log('✅ Database connected');
                return true;
                
            } catch (error) {
                console.error('Database error:', error);
                throw error;
            }
        }
        
        async function loadEssentialData() {
            try {
                // Load diseases
                const { data: diseases, error: dError } = await STATE.supabase
                    .from('diseases')
                    .select('*')
                    .order('disease_name');
                
                if (dError) {
                    console.warn('Could not load diseases:', dError.message);
                    // Create default diseases
                    STATE.diseases = [{
                        id: 1,
                        disease_name: 'Asthma',
                        description: 'Chronic inflammatory airway disease'
                    }];
                } else {
                    STATE.d diseases = diseases;
                }
                
                // Load treatable traits
                const { data: traits, error: tError } = await STATE.supabase
                    .from('treatable_traits')
                    .select('*')
                    .order('trait_name');
                
                if (tError) {
                    console.warn('Could not load traits:', tError.message);
                    // Create demo traits
                    STATE.traits = createDemoTraits();
                } else {
                    STATE.traits = traits;
                }
                
                // Load trait connections
                const traitIds = STATE.traits.map(t => t.id);
                if (traitIds.length > 0) {
                    const { data: connections, error: cError } = await STATE.supabase
                        .from('trait_networks')
                        .select('*')
                        .in('source_trait_id', traitIds)
                        .in('target_trait_id', traitIds);
                    
                    if (!cError) {
                        STATE.connections = connections || [];
                    }
                }
                
                // Set current disease
                STATE.currentDisease = STATE.diseases.find(d => d.id == CONFIG.DEFAULT_DISEASE_ID) || STATE.diseases[0];
                
                console.log(`📊 Loaded: ${STATE.diseases.length} diseases, ${STATE.traits.length} traits, ${STATE.connections.length} connections`);
                
            } catch (error) {
                console.error('Error loading data:', error);
                // Use demo data as fallback
                loadDemoData();
            }
        }
        
        function createDemoTraits() {
            return [
                {
                    id: 1,

                    category: 'Inflammatory',
                    description: 'Elevated eosinophils and IgE-mediated inflammation',
                    measurement_method: 'Blood eosinophil count, FeNO'
                },
                {
                    id: 2,
                    trait_name: 'Airflow Limitation',
                    category: 'Physiological',
                    description: 'Reduced FEV1/FVC ratio with bronchodilator reversibility',
                    measurement_method: 'Spirometry'
                },

                    trait_name: 'Bronchial Hyperresponsiveness',

                {

        }
        
        function loadDemoData() {
            STATE.diseases = [{
                id: 1,
                disease_name: 'Asthma',
                description: 'Chronic inflammatory airway disease',
                icd10_code: 'J45'
            }];
            
            STATE.traits = createDemoTraits();
            
            STATE.connections = [
                { id: 1, source_trait_id: 1, target_trait_id: 2, relationship_type: 'exacerbates', strength: 4 },
                { id: 2, source_trait_id: 1, target_trait_id: 3, relationship_type: 'causes', strength: 5 },
                { id: 3, source_trait_id: 5, target_trait_id: 1, relationship_type: 'triggers', strength: 4 },
                { id: 4, source_trait_id: 4, target_trait_id: 2, relationship_type: 'exacerbates', strength: 3 }
            ];
            
            STATE.currentDisease = STATE.diseases[0];
        }
        
        // ====== VISUALIZATION ======
        function initializeVisualization() {
            const canvas = document.getElementById('visualization-canvas');
            const container = canvas.parentElement;
            
            // Scene
            STATE.scene = new THREE.Scene();
            STATE.scene.background = new THREE.Color(0x0a0e17);
            
            // Camera
            STATE.camera = new THREE.PerspectiveCamera(
                75,
                container.clientWidth / container.clientHeight,
                0.1,
                1000
            );
            STATE.camera.position.set(5, 3, 5);
            STATE.camera.lookAt(0, 0, 0);
            
            // Renderer
            STATE.renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                antialias: true,
                alpha: true
            });
            STATE.renderer.setSize(container.clientWidth, container.clientHeight);
            STATE.renderer.setPixelRatio(window.devicePixelRatio);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            STATE.scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 5, 5);
            STATE.scene.add(directionalLight);
            
            // Create network visualization
            createNetworkVisualization();
            
            // Start animation
            function animate() {
                STATE.animationId = requestAnimationFrame(animate);
                updatePhysics();
                STATE.renderer.render(STATE.scene, STATE.camera);
            }
            animate();
            
            // Handle resize
            window.addEventListener('resize', () => {
                STATE.renderer.setSize(container.clientWidth, container.clientHeight);
                STATE.camera.aspect = container.clientWidth / container.clientHeight;
                STATE.camera.updateProjectionMatrix();
            });
        }
        
        function createNetworkVisualization() {
            // Clear existing
            while(STATE.scene.children.length > 2) { // Keep lights
                STATE.scene.remove(STATE.scene.children[2]);
            }
            
            // Create trait nodes
            STATE.traitNodes = [];
            
            STATE.traits.forEach((trait, index) => {
                // Node properties
                const color = getTraitColor(trait.category);
                const size = 0.3 + (Math.random() * 0.2);
                
                // Geometry
                const geometry = new THREE.SphereGeometry(size, 16, 16);
                const material = new THREE.MeshPhongMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.2,
                    transparent: true,
                    opacity: 0.9
                });
                
                const node = new THREE.Mesh(geometry, material);
                
                // Position in 3D sphere
                const phi = Math.acos(-1 + (2 * index) / STATE.traits.length);
                const theta = Math.sqrt(STATE.traits.length * Math.PI) * phi;
                
                const radius = 4;
                node.position.x = radius * Math.sin(phi) * Math.cos(theta);
                node.position.y = radius * Math.sin(phi) * Math.sin(theta);
                node.position.z = radius * Math.cos(phi);
                
                STATE.scene.add(node);
                STATE.traitNodes.push({ mesh: node, trait: trait, velocity: new THREE.Vector3() });
                
                // Add label
                addNodeLabel(node, trait.trait_name, trait.category);
            });
            
            // Create connections
            STATE.connections.forEach(conn => {
                const sourceNode = STATE.traitNodes.find(n => n.trait.id === conn.source_trait_id);
                const targetNode = STATE.traitNodes.find(n => n.trait.id === conn.target_trait_id);
                
                if (sourceNode && targetNode) {
                    const color = getConnectionColor(conn.relationship_type);
                    const width = 0.05 + (conn.strength * 0.02) || 0.1;
                    
                    // Create curved line
                    const curve = new THREE.CatmullRomCurve3([
                        sourceNode.mesh.position,
                        new THREE.Vector3(
                            (sourceNode.mesh.position.x + targetNode.mesh.position.x) / 2 + (Math.random() - 0.5),
                            (sourceNode.mesh.position.y + targetNode.mesh.position.y) / 2 + 1,
                            (sourceNode.mesh.position.z + targetNode.mesh.position.z) / 2 + (Math.random() - 0.5)
                        ),
                        targetNode.mesh.position
                    ]);
                    
                    const geometry = new THREE.TubeGeometry(curve, 20, width, 8, false);
                    const material = new THREE.MeshBasicMaterial({
                        color: color,
                        transparent: true,
                        opacity: 0.6
                    });
                    
                    const connection = new THREE.Mesh(geometry, material);
                    STATE.scene.add(connection);
                }
            });
            
            console.log(`🎨 Created ${STATE.traitNodes.length} nodes and ${STATE.connections.length} connections`);
        }
        
        function addNodeLabel(node, name, category) {
            // Create HTML label (simplified version)
            // In production, use CSS3DRenderer or sprites
            console.log(`Label: ${name} (${category}) at`, node.position);
        }
        
        function updatePhysics() {
            if (!CONFIG.USE_SIMPLE_PHYSICS || !STATE.traitNodes) return;
            
            // Simple repulsion/attraction physics
            STATE.traitNodes.forEach((nodeA, i) => {
                let force = new THREE.Vector3(0, 0, 0);
                
                STATE.traitNodes.forEach((nodeB, j) => {
                    if (i === j) return;
                    
                    const direction = new THREE.Vector3()
                        .subVectors(nodeA.mesh.position, nodeB.mesh.position);
                    const distance = direction.length();
                    
                    if (distance > 0) {
                        direction.normalize();
                        
                        // Repulsion when too close
                        if (distance < 3) {
                            force.add(direction.multiplyScalar(0.1 / distance));
                        }
                        // Attraction when too far
                        else if (distance > 6) {
                            force.add(direction.multiplyScalar(-0.01 * distance));
                        }
                    }
                });
                
                // Apply force with damping
                nodeA.velocity.multiplyScalar(0.95);
                nodeA.velocity.add(force);
                nodeA.mesh.position.add(nodeA.velocity);
                
                // Keep within bounds
                const center = new THREE.Vector3(0, 0, 0);
                const toCenter = new THREE.Vector3().subVectors(center, nodeA.mesh.position);
                if (toCenter.length() > 8) {
                    nodeA.mesh.position.add(toCenter.normalize().multiplyScalar(0.1));
                }
            });
        }
        
        function getTraitColor(category) {
            const colors = {
                'Inflammatory': 0xef476f,    // Red
                'Physiological': 0x06d6a0,   // Green
                'Behavioral': 0xffd166,      // Yellow
                'Comorbid': 0x118ab2,        // Blue
                'Environmental': 0x9d4edd,   // Purple
                'Treatment': 0x3b82f6        // Light Blue
            };
            return colors[category] || 0x888888;
        }
        
        function getConnectionColor(relationship) {
            const colors = {
                'causes': 0xef476f,         // Red
                'exacerbates': 0xff9e00,    // Orange
                'mitigates': 0x06d6a0,      // Green
                'treats': 0x3b82f6,         // Blue
                'triggers': 0x9d4edd,       // Purple
                'correlates_with': 0x94a3b8 // Gray
            };
            return colors[relationship] || 0x888888;
        }
        
        // ====== UI FUNCTIONS ======

            $('#patientName').text(CONFIG.DEFAULT_PATIENT.name);
            $('#patientAge').text(CONFIG.DEFAULT_PATIENT.age);

            // Update visualization title
            $('#vizTitle').text('Airway Digital Twin');
            $('#vizSubtitle').text(`${STATE.traits.length} traits | ${STATE.connections.length} connections | ${STATE.currentDisease?.disease_name || 'Asthma'}`);

            physiologyTab.append(`

                    <div class="parameter-unit">cmH₂O/L/s</div>
                </div>
                
                <div class="parameter-group">
                    <div class="parameter-label">
                        <span class="parameter-name">Lung Compliance</span>
                        <span class="parameter-value" id="complianceValue">${STATE.physiology.compliance}</span>
                    </div>
                    <input type="range" min="0.05" max="0.5" value="${STATE.physiology.compliance}" step="0.01" 
                           class="slider" id="complianceSlider"
                           oninput="updatePhysiology('compliance', this.value)">
                    <div class="parameter-unit">L/cmH₂O</div>
                </div>
                
                <div class="parameter-group">
                    <div class="parameter-label">

                </div>
                
                <div style="margin-top: 20px;">
                    <button class="btn" onclick="runSimulation('exacerbation')" style="width: 48%; margin-right: 4%;">
                        Simulate Exacerbation
                    </button>
                    <button class="btn" onclick="runSimulation('treatment')" style="width: 48%;">

            `);
        }
        
        function initializeCharts() {
            // Initialize risk prediction chart
            const ctx = document.createElement('canvas');
            ctx.id = 'riskChart';
            $('#physiologyTab').append(`<div class="chart-container"><canvas id="riskChart"></canvas></div>`);
            
            STATE.charts.risk = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Now', '6h', '12h', '18h', '24h'],
                    datasets: [{
                        label: 'Exacerbation Risk',
                        data: [15, 22, 28, 35, 42],
                        borderColor: '#f59e0b',
                        backgroundColor: 'rgba(245, 158, 11, 0.1)',
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } }
                }
            });
        }
        
        // ====== SIMULATION FUNCTIONS ======
        function updatePhysiology(param, value) {
            value = parseFloat(value);
            
            switch(param) {
                case 'resistance':
                    STATE.physiology.resistance = value;
                    $('#resistanceValue').text(value.toFixed(1));
                    break;
                case 'compliance':
                    STATE.physiology.compliance = value;
                    $('#complianceValue').text(value.toFixed(2));
                    break;
                case 'inflammation':
                    STATE.physiology.inflammation = value;
                    $('#inflammationValue').text(value);
                    break;
            }
            
            // Update visualization based on physiology
            updateVisualizationFromPhysiology();
        }
        
        function updateVisualizationFromPhysiology() {
            // Update node colors based on inflammation
            const inflammation = STATE.physiology.inflammation / 100;
            
            STATE.traitNodes.forEach(node => {
                if (node.trait.category === 'Inflammatory') {
                    const color = getTraitColor('Inflammatory');
                    const intensity = 0.2 + (inflammation * 0.8);
                    node.mesh.material.emissiveIntensity = intensity;
                    node.mesh.material.opacity = 0.7 + (inflammation * 0.3);
                }
            });
        }
        
        function runSimulation(type) {
            showNotification(`Running ${type} simulation...`, 'info');
            
            if (type === 'exacerbation') {
                // Increase inflammation and resistance
                STATE.physiology.inflammation = 75;
                STATE.physiology.resistance = 12;
                
                $('#inflammationSlider').val(75).trigger('input');
                $('#resistanceSlider').val(12).trigger('input');
                
                setTimeout(() => {
                    showNotification('Exacerbation simulated. Inflammation and resistance increased.', 'warning');
                }, 1000);
                
            } else if (type === 'treatment') {
                // Decrease inflammation and resistance
                STATE.physiology.inflammation = 25;
                STATE.physiology.resistance = 4;
                
                $('#inflammationSlider').val(25).trigger('input');
                $('#resistanceSlider').val(4).trigger('input');
                
                setTimeout(() => {
                    showNotification('Treatment simulated. Inflammation and resistance decreased.', 'success');
                }, 1000);
            }
            
            // Update risk chart
            updateRiskChart();
        }
        
        function updateRiskChart() {
            if (!STATE.charts.risk) return;
            
            const baseRisk = 10 + (STATE.physiology.inflammation * 0.3);
            const riskData = [
                baseRisk,
                baseRisk * 1.2,
                baseRisk * 1.4,
                baseRisk * 1.6,
                baseRisk * 1.8
            ];
            
            STATE.charts.risk.data.datasets[0].data = riskData;
            STATE.charts.risk.update();
        }
        
        // ====== UTILITY FUNCTIONS ======
        function updateLoading(progress, text) {
            $('#loadingProgress').css('width', `${progress}%`);
            if (text) $('#loadingSubtitle').text(text);
        }
        
        function showNotification(message, type = 'info') {
            const colors = {
                success: '#10b981',
                info: '#3b82f6',
                warning: '#f59e0b',
                error: '#ef476f'
            };
            
            const notification = $(`
                <div style="position: fixed; top: 20px; right: 20px; 
                           background: ${colors[type]}; color: white; 
                           padding: 12px 20px; border-radius: 8px; 
                           font-weight: 600; z-index: 9999; 
                           animation: slideIn 0.3s ease;">
                    ${message}
                </div>
            `);
            
            $('body').append(notification);
            
            setTimeout(() => {
                notification.fadeOut(300, () => notification.remove());
            }, 3000);
        }
