<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRAITMAP 2.0 - Clinical Intelligence Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ==================== GLOBAL VARIABLES & RESET ==================== */
        :root {
            /* Primary Colors */
            --primary-blue: #0066ff;
            --secondary-blue: #4d94ff;
            --accent-blue: #80b3ff;
            --dark-blue: #000814;
            --panel-blue: #0a193c;
            
            /* Clinical Status Colors */
            --success-green: #00cc88;
            --warning-orange: #ffaa00;
            --danger-red: #ff3366;
            --info-cyan: #00ccff;
            --evidence-gold: #ffd700;
            --evidence-silver: #c0c0c0;
            --evidence-bronze: #cd7f32;
            
            /* Category Colors */
            --immune-color: #ff3366;
            --physio-color: #00cc88;
            --clinical-color: #ffaa00;
            --comorbidity-color: #9966ff;
            --biomarker-color: #00ccff;
            --treatment-color: #ff66cc;
            
            /* UI Colors */
            --dark-bg: #000814;
            --panel-bg: rgba(10, 25, 60, 0.98);
            --hover-bg: rgba(255, 255, 255, 0.1);
            --border-color: rgba(255, 255, 255, 0.15);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --text-tertiary: rgba(255, 255, 255, 0.6);
            
            /* Shadows */
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.4);
            --glow-primary: 0 0 30px rgba(0, 102, 255, 0.5);
            --glow-success: 0 0 30px rgba(0, 204, 136, 0.5);
            
            /* Transitions */
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-medium: 300ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 500ms cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Layout */
            --header-height: 60px;
            --sidebar-width: 300px;
            --properties-width: 320px;
            --tools-size: 44px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        body {
            background: linear-gradient(135deg, var(--dark-bg) 0%, #001428 100%);
            color: var(--text-primary);
            min-height: 100vh;
            font-size: 14px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* ==================== LOADING SCREEN ==================== */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #001428 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity var(--transition-medium);
        }
        
        .loading-content {
            text-align: center;
            padding: 2rem;
            max-width: 90%;
        }
        
        .loading-logo {
            font-size: 4rem;
            color: var(--primary-blue);
            margin-bottom: 1.5rem;
            animation: pulseGlow 2s infinite alternate;
        }
        
        @keyframes pulseGlow {
            0% { 
                filter: drop-shadow(0 0 10px var(--primary-blue));
                transform: scale(1);
            }
            100% { 
                filter: drop-shadow(0 0 30px var(--evidence-gold));
                transform: scale(1.05);
            }
        }
        
        .loading-title {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-blue), var(--info-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }
        
        @media (max-width: 768px) {
            .loading-title {
                font-size: 2rem;
            }
            .loading-logo {
                font-size: 3rem;
            }
        }
        
        /* ==================== HEADER ==================== */
        .header {
            height: var(--header-height);
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            box-shadow: var(--shadow-md);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary-blue), var(--comorbidity-color));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            box-shadow: var(--glow-primary);
            flex-shrink: 0;
        }
        
        .logo-text {
            display: flex;
            flex-direction: column;
        }
        
        .logo-text h1 {
            font-size: 1.25rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-blue), white);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }
        
        .logo-text p {
            font-size: 0.75rem;
            color: var(--accent-blue);
            font-weight: 500;
        }
        
        .header-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        
        /* ==================== MOBILE OPTIMIZATIONS ==================== */
        @media (max-width: 768px) {
            :root {
                --header-height: 56px;
                --tools-size: 40px;
            }
            
            .header {
                padding: 0 0.75rem;
            }
            
            .logo-icon {
                width: 36px;
                height: 36px;
                font-size: 1.1rem;
            }
            
            .logo-text h1 {
                font-size: 1.1rem;
            }
            
            .logo-text p {
                font-size: 0.7rem;
            }
            
            .btn span {
                display: none;
            }
            
            .btn {
                padding: 0.6rem;
                min-width: 44px;
                justify-content: center;
            }
        }
        
        /* ==================== MAIN LAYOUT ==================== */
        .main-container {
            display: flex;
            height: calc(100vh - var(--header-height));
            margin-top: var(--header-height);
            position: relative;
            overflow: hidden;
        }
        
        /* ==================== SIDEBAR ==================== */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform var(--transition-medium);
            overflow: hidden;
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 900;
        }
        
        .sidebar.show {
            transform: translateX(0);
        }
        
        /* ==================== CANVAS AREA ==================== */
        .canvas-area {
            flex: 1;
            position: relative;
            background: 
                radial-gradient(circle at 20% 80%, rgba(0, 102, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 204, 136, 0.05) 0%, transparent 50%);
            overflow: hidden;
        }
        
        #networkCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        
        /* ==================== TOOLS PANEL ==================== */
        .tools-panel {
            position: absolute;
            top: 1rem;
            left: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.75rem;
            box-shadow: var(--shadow-lg);
            z-index: 50;
        }
        
        @media (max-width: 768px) {
            .tools-panel {
                flex-direction: row;
                top: auto;
                bottom: 1rem;
                left: 50%;
                transform: translateX(-50%);
                padding: 0.5rem;
                gap: 0.25rem;
            }
            
            .tool-btn {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
            
            .tool-btn::after {
                display: none;
            }
        }
        
        /* ==================== AI SUGGESTIONS - OPTIMIZED ==================== */
        .ai-suggestions {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            width: 280px;
            max-width: 90vw;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            z-index: 50;
            transform: translateY(20px);
            opacity: 0;
            transition: all var(--transition-medium);
        }
        
        .ai-suggestions.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        @media (max-width: 768px) {
            .ai-suggestions {
                width: calc(100% - 2rem);
                max-height: 200px;
                bottom: 5rem;
                right: 1rem;
                left: 1rem;
            }
        }
        
        /* ==================== PROPERTIES PANEL ==================== */
        .properties-panel {
            width: var(--properties-width);
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform var(--transition-medium);
            overflow: hidden;
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            z-index: 900;
        }
        
        .properties-panel.show {
            transform: translateX(0);
        }
        
        /* ==================== MOBILE TOGGLE BUTTONS ==================== */
        .mobile-toggle {
            display: none;
            position: fixed;
            z-index: 1000;
            background: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-lg);
            font-size: 1.25rem;
        }
        
        .toggle-sidebar {
            bottom: 6rem;
            left: 1rem;
        }
        
        .toggle-properties {
            bottom: 6rem;
            right: 1rem;
        }
        
        .toggle-aisuggestions {
            bottom: 12rem;
            right: 1rem;
        }
        
        @media (max-width: 768px) {
            .sidebar:not(.show) {
                transform: translateX(-100%);
            }
            
            .properties-panel:not(.show) {
                transform: translateX(100%);
            }
            
            .mobile-toggle {
                display: flex;
            }
        }
        
        /* ==================== TOUCH OPTIMIZATIONS ==================== */
        .trait-item {
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* Prevent text selection on canvas */
        .canvas-area {
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* ==================== PERFORMANCE OPTIMIZATIONS ==================== */
        .trait-node {
            will-change: transform;
            contain: layout style paint;
        }
        
        #networkCanvas {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        
        /* ==================== UTILITY CLASSES ==================== */
        .hidden {
            display: none !important;
        }
        
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        
        /* ==================== SCROLLBAR ==================== */
        .scrollbar-thin::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        
        .scrollbar-thin::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
        }
        
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
        
        .scrollbar-thin::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        /* ==================== REST OF STYLES (condensed for space) ==================== */
        /* Button styles */
        .btn {
            padding: 0.6rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all var(--transition-medium);
            white-space: nowrap;
            min-height: 40px;
        }
        
        .btn:hover {
            background: var(--hover-bg);
            transform: translateY(-1px);
            border-color: var(--primary-blue);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue));
            border: none;
        }
        
        .tool-btn {
            width: var(--tools-size);
            height: var(--tools-size);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all var(--transition-medium);
        }
        
        .tool-btn.active {
            background: var(--primary-blue);
            border-color: var(--primary-blue);
        }
        
        /* Property sections */
        .property-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        
        /* Connection mode */
        .connection-mode {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border: 2px solid var(--primary-blue);
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            font-weight: 700;
            box-shadow: 0 0 30px rgba(0, 102, 255, 0.4);
            display: none;
            align-items: center;
            gap: 0.75rem;
            z-index: 100;
            font-size: 0.9rem;
        }
        
        /* Toast notifications */
        .toast-container {
            position: fixed;
            bottom: 1rem;
            left: 1rem;
            right: 1rem;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .toast {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary-blue);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-md);
        }
        
        /* Modal adjustments */
        .modal {
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
        }
        
        @media (max-width: 480px) {
            .modal {
                width: 95%;
                margin: 1rem;
            }
        }
        
        /* Landscape orientation support */
        @media (max-height: 600px) and (orientation: landscape) {
            :root {
                --header-height: 48px;
            }
            
            .tools-panel {
                flex-direction: row;
                top: auto;
                bottom: 0.5rem;
            }
            
            .ai-suggestions {
                max-height: 150px;
            }
        }
        
        /* High-DPI optimization */
        @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
            .header, .tools-panel, .ai-suggestions, .properties-panel {
                backdrop-filter: blur(40px);
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen">
        <div class="loading-content">
            <div class="loading-logo">
                <i class="fas fa-brain"></i>
            </div>
            <h1 class="loading-title">TRAITMAP 2.0</h1>
            <p class="loading-tagline">Mobile-Optimized Clinical Intelligence</p>
            
            <div class="loading-progress-container">
                <div class="loading-bar">
                    <div class="loading-fill" id="loadingFill"></div>
                </div>
                <div class="loading-message" id="loadingMessage">
                    Optimizing for mobile...
                </div>
            </div>
        </div>
    </div>
    
    <!-- Header -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-network-wired"></i>
            </div>
            <div class="logo-text">
                <h1>TRAITMAP 2.0</h1>
                <p>Clinical Intelligence</p>
            </div>
        </div>
        
        <div class="header-controls">
            <button class="btn" id="btnImport" title="Import Patient">
                <i class="fas fa-user-md"></i>
                <span>Import</span>
            </button>
            
            <button class="btn" id="btnSimulate" title="Run Simulation">
                <i class="fas fa-rocket"></i>
                <span>Simulate</span>
            </button>
            
            <button class="btn btn-primary" id="btnShare" title="Share Analysis">
                <i class="fas fa-share-alt"></i>
                <span>Share</span>
            </button>
        </div>
    </header>
    
    <!-- Main Content -->
    <div class="main-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">
                    <i class="fas fa-shapes"></i>
                    Clinical Trait Library
                </div>
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchTraits" placeholder="Search 50+ traits...">
                </div>
            </div>
            
            <div class="category-tabs">
                <div class="category-tab active" data-category="all">All</div>
                <div class="category-tab" data-category="immune">Immune</div>
                <div class="category-tab" data-category="physio">Physio</div>
                <div class="category-tab" data-category="clinical">Clinical</div>
                <div class="category-tab" data-category="comorbid">Comorbid</div>
            </div>
            
            <div class="trait-library scrollbar-thin">
                <!-- Traits will be loaded dynamically -->
            </div>
        </aside>
        
        <!-- Canvas Area -->
        <main class="canvas-area">
            <canvas id="networkCanvas"></canvas>
            
            <!-- Tools Panel -->
            <div class="tools-panel">
                <button class="tool-btn active" data-tool="select" title="Select">
                    <i class="fas fa-mouse-pointer"></i>
                </button>
                <button class="tool-btn" data-tool="connect" title="Connect">
                    <i class="fas fa-link"></i>
                </button>
                <button class="tool-btn" data-tool="hand" title="Move">
                    <i class="fas fa-hand-paper"></i>
                </button>
                <button class="tool-btn" data-tool="layout" title="Arrange">
                    <i class="fas fa-sitemap"></i>
                </button>
                <button class="tool-btn" data-tool="delete" title="Delete">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
            
            <!-- AI Suggestions Panel -->
            <div class="ai-suggestions scrollbar-thin" id="aiSuggestions">
                <!-- AI suggestions will be loaded here -->
            </div>
            
            <!-- Connection Mode Indicator -->
            <div class="connection-mode" id="connectionMode">
                <i class="fas fa-link"></i>
                <span>Connection Mode Active</span>
            </div>
        </main>
        
        <!-- Properties Panel -->
        <aside class="properties-panel" id="propertiesPanel">
            <div class="properties-tabs">
                <div class="properties-tab active" data-tab="properties">Properties</div>
                <div class="properties-tab" data-tab="evidence">Evidence</div>
                <div class="properties-tab" data-tab="connections">Connections</div>
            </div>
            
            <div class="properties-content scrollbar-thin">
                <!-- Content will be loaded dynamically -->
            </div>
        </aside>
        
        <!-- Mobile Toggle Buttons -->
        <button class="mobile-toggle toggle-sidebar" id="toggleSidebar" title="Toggle Sidebar">
            <i class="fas fa-bars"></i>
        </button>
        
        <button class="mobile-toggle toggle-properties" id="toggleProperties" title="Toggle Properties">
            <i class="fas fa-sliders-h"></i>
        </button>
        
        <button class="mobile-toggle toggle-aisuggestions" id="toggleAISuggestions" title="Toggle AI Suggestions">
            <i class="fas fa-robot"></i>
        </button>
    </div>
    
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>
    
    <script>
        // ============================================
        // TRAITMAP 2.0 - OPTIMIZED VERSION
        // ============================================
        
        // Performance optimizations
        const PERFORMANCE = {
            MAX_TRAITS: 100,
            MAX_CONNECTIONS: 200,
            FRAME_THROTTLE: 1000 / 30, // 30 FPS max for mobile
            BATCH_RENDER: true,
            USE_RAILING: true
        };
        
        // Application State
        const AppState = {
            traits: new Map(),
            connections: new Map(),
            selectedTraits: new Set(),
            currentTool: 'select',
            isConnecting: false,
            connectionStart: null,
            isDragging: false,
            
            // UI State
            activeCategory: 'all',
            activeTab: 'properties',
            sidebarVisible: false,
            propertiesVisible: false,
            suggestionsVisible: false,
            
            // Performance
            renderScale: 1,
            lastRenderTime: 0,
            renderScheduled: false,
            fps: 0,
            lastFpsUpdate: 0,
            frameCount: 0,
            
            // Mobile detection
            isMobile: false,
            isTouchDevice: false
        };
        
        // ==================== OPTIMIZED RENDERING ENGINE ====================
        
        class OptimizedRenderer {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d', { alpha: true });
                this.dpr = window.devicePixelRatio || 1;
                
                // Separate layer for connections
                this.connectionsLayer = document.createElement('canvas');
                this.connectionsCtx = this.connectionsLayer.getContext('2d');
                
                // Separate layer for traits
                this.traitsLayer = document.createElement('canvas');
                this.traitsCtx = this.traitsLayer.getContext('2d');
                
                // Interactive SVG layer
                this.svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                this.svg.style.position = 'absolute';
                this.svg.style.top = '0';
                this.svg.style.left = '0';
                this.svg.style.width = '100%';
                this.svg.style.height = '100%';
                this.svg.style.pointerEvents = 'none';
                
                this.canvas.parentElement.appendChild(this.svg);
                this.resize();
                
                // Performance monitoring
                this.renderStats = {
                    lastFrameTime: 0,
                    averageFrameTime: 0,
                    framesThisSecond: 0,
                    lastFpsUpdate: 0,
                    fps: 60
                };
            }
            
            resize() {
                const rect = this.canvas.parentElement.getBoundingClientRect();
                const width = rect.width;
                const height = rect.height;
                
                // Set canvas dimensions
                [this.canvas, this.connectionsLayer, this.traitsLayer].forEach(canvas => {
                    canvas.width = width * this.dpr;
                    canvas.height = height * this.dpr;
                    canvas.style.width = width + 'px';
                    canvas.style.height = height + 'px';
                });
                
                // Scale contexts
                [this.ctx, this.connectionsCtx, this.traitsCtx].forEach(ctx => {
                    ctx.scale(this.dpr, this.dpr);
                });
                
                // Update SVG
                this.svg.setAttribute('width', width);
                this.svg.setAttribute('height', height);
            }
            
            clear() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.dpr, this.canvas.height / this.dpr);
                this.connectionsCtx.clearRect(0, 0, this.connectionsLayer.width, this.connectionsLayer.height);
                this.traitsCtx.clearRect(0, 0, this.traitsLayer.width, this.traitsLayer.height);
                
                // Clear SVG
                while (this.svg.firstChild) {
                    this.svg.removeChild(this.svg.firstChild);
                }
            }
            
            render(traits, connections, scale, selectedTraits) {
                const now = performance.now();
                const delta = now - this.renderStats.lastFrameTime;
                
                // Throttle rendering for performance
                if (delta < PERFORMANCE.FRAME_THROTTLE && PERFORMANCE.USE_RAILING) {
                    if (!this.renderScheduled) {
                        this.renderScheduled = true;
                        requestAnimationFrame(() => {
                            this.renderScheduled = false;
                            this._render(traits, connections, scale, selectedTraits);
                        });
                    }
                    return;
                }
                
                this.renderStats.lastFrameTime = now;
                this._render(traits, connections, scale, selectedTraits);
            }
            
            _render(traits, connections, scale, selectedTraits) {
                this.clear();
                
                // Update FPS counter
                this.updateFPS();
                
                // Batch render connections (less frequent updates)
                if (this.shouldRedrawConnections()) {
                    this.renderConnections(connections, scale);
                }
                
                // Batch render traits
                this.renderTraits(traits, scale, selectedTraits);
                
                // Composite layers
                this.ctx.drawImage(this.connectionsLayer, 0, 0);
                this.ctx.drawImage(this.traitsLayer, 0, 0);
                
                // Render connection mode line if active
                if (AppState.isConnecting && AppState.connectionStart) {
                    this.renderConnectionLine();
                }
            }
            
            renderConnections(connections, scale) {
                this.connectionsCtx.clearRect(0, 0, 
                    this.connectionsLayer.width / this.dpr, 
                    this.connectionsLayer.height / this.dpr
                );
                
                connections.forEach((connection, connId) => {
                    const source = AppState.traits.get(connection.sourceId);
                    const target = AppState.traits.get(connection.targetId);
                    
                    if (!source || !target) return;
                    
                    this.connectionsCtx.beginPath();
                    this.connectionsCtx.moveTo(source.x, source.y);
                    this.connectionsCtx.lineTo(target.x, target.y);
                    this.connectionsCtx.strokeStyle = connection.getColor();
                    this.connectionsCtx.lineWidth = 3 * scale;
                    this.connectionsCtx.globalAlpha = 0.6;
                    this.connectionsCtx.stroke();
                    this.connectionsCtx.globalAlpha = 1;
                });
            }
            
            renderTraits(traits, scale, selectedTraits) {
                this.traitsCtx.clearRect(0, 0, 
                    this.traitsLayer.width / this.dpr, 
                    this.traitsLayer.height / this.dpr
                );
                
                traits.forEach((trait, traitId) => {
                    this.renderTrait(trait, scale, selectedTraits.has(traitId));
                });
            }
            
            renderTrait(trait, scale, isSelected) {
                const ctx = this.traitsCtx;
                const x = trait.x;
                const y = trait.y;
                const radius = 25 * scale;
                
                // Draw selection glow
                if (isSelected) {
                    ctx.beginPath();
                    ctx.arc(x, y, radius + 8, 0, Math.PI * 2);
                    ctx.fillStyle = trait.color + '40';
                    ctx.fill();
                }
                
                // Draw trait circle
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fillStyle = trait.color;
                ctx.fill();
                
                // Draw selection border
                if (isSelected) {
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, Math.PI * 2);
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 2 * scale;
                    ctx.stroke();
                }
                
                // Draw icon (simplified for performance)
                ctx.fillStyle = 'white';
                ctx.font = `${Math.max(12, 14 * scale)}px FontAwesome`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('•', x, y);
            }
            
            renderConnectionLine() {
                if (!AppState.connectionStart || !AppState.lastMousePos) return;
                
                this.ctx.beginPath();
                this.ctx.moveTo(AppState.connectionStart.x, AppState.connectionStart.y);
                this.ctx.lineTo(AppState.lastMousePos.x, AppState.lastMousePos.y);
                this.ctx.strokeStyle = '#00ccff';
                this.ctx.lineWidth = 2 * AppState.renderScale;
                this.ctx.setLineDash([5, 5]);
                this.ctx.stroke();
                this.ctx.setLineDash([]);
            }
            
            shouldRedrawConnections() {
                // Only redraw connections every 10 frames or when traits move
                return this.renderStats.frameCount % 10 === 0 || AppState.isDragging;
            }
            
            updateFPS() {
                const now = performance.now();
                this.renderStats.frameCount++;
                
                if (now >= this.renderStats.lastFpsUpdate + 1000) {
                    this.renderStats.fps = this.renderStats.framesThisSecond;
                    this.renderStats.framesThisSecond = 0;
                    this.renderStats.lastFpsUpdate = now;
                    
                    // Log warning only if really low FPS
                    if (this.renderStats.fps < 20 && AppState.traits.size > 5) {
                        console.warn(`Low FPS: ${this.renderStats.fps}. Traits: ${AppState.traits.size}`);
                    }
                }
                this.renderStats.framesThisSecond++;
            }
            
            getFPS() {
                return this.renderStats.fps;
            }
        }

            createTraitCard(traitData) {
                const libraryContainer = document.querySelector('.trait-library');
                
                const card = document.createElement('div');
                card.className = 'trait-item';
                card.draggable = !AppState.isTouchDevice;
                card.dataset.traitId = traitData.id;
                card.dataset.category = traitData.category;
                
                card.innerHTML = `
                    <div class="trait-name">
                        <span class="trait-color" style="background: ${traitData.color}"></span>
                        ${traitData.name}
                    </div>
                    <div class="trait-desc">${traitData.description}</div>
                `;
                
                if (!AppState.isTouchDevice) {
                    card.addEventListener('dragstart', (e) => {
                        e.dataTransfer.setData('text/plain', traitData.id);
                        card.classList.add('dragging');
                    });
                    
                    card.addEventListener('dragend', () => {
                        card.classList.remove('dragging');
                    });
                } else {
                    // Touch handling for mobile
                    card.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        this.handleTouchStart(e, traitData);
                    }, { passive: false });
                }
                
                libraryContainer.appendChild(card);
            }
            
            handleTouchStart(e, traitData) {
                // Create touch-based drag for mobile
                const touch = e.touches[0];
                AppState.lastTouch = { x: touch.clientX, y: touch.clientY };
                AppState.draggedTrait = traitData;
                
                document.addEventListener('touchmove', this.handleTouchMove.bind(this), { passive: false });
                document.addEventListener('touchend', this.handleTouchEnd.bind(this));
            }
            
            handleTouchMove(e) {
                if (!AppState.draggedTrait) return;
                
                e.preventDefault();
                const touch = e.touches[0];
                const rect = this.canvas.getBoundingClientRect();
                const x = (touch.clientX - rect.left) * (this.canvas.width / rect.width);
                const y = (touch.clientY - rect.top) * (this.canvas.height / rect.height);
                
                // Add trait at touch position
                this.addTraitAtPosition(AppState.draggedTrait, x, y);
                AppState.draggedTrait = null;
                
                // Clean up listeners
                document.removeEventListener('touchmove', this.handleTouchMove.bind(this));
                document.removeEventListener('touchend', this.handleTouchEnd.bind(this));
            }
            
            handleTouchEnd() {
                AppState.draggedTrait = null;
                document.removeEventListener('touchmove', this.handleTouchMove.bind(this));
                document.removeEventListener('touchend', this.handleTouchEnd.bind(this));
            }
            
            addTraitAtPosition(traitData, x, y) {
                const trait = {
                    ...traitData,
                    id: `trait-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
                    x: x,
                    y: y
                };
                
                AppState.traits.set(trait.id, trait);
                this.render();
                this.showToast(`Added ${trait.name}`, 'success');
            }
            
            filterTraits(searchTerm) {
                document.querySelectorAll('.trait-item').forEach(card => {
                    const name = card.querySelector('.trait-name').textContent.toLowerCase();
                    const desc = card.querySelector('.trait-desc').textContent.toLowerCase();
                    const matches = name.includes(searchTerm) || desc.includes(searchTerm);
                    card.style.display = matches ? 'block' : 'none';
                });
            }
            
            filterByCategory(category) {
                AppState.activeCategory = category;
                
                document.querySelectorAll('.category-tab').forEach(tab => {
                    tab.classList.toggle('active', tab.dataset.category === category);
                });
                
                document.querySelectorAll('.trait-item').forEach(card => {
                    if (category === 'all') {
                        card.style.display = 'block';

                        card.style.display = card.dataset.category === category ? 'block' : 'none';
                    }

            setupEventListeners() {

                    this.setupTouchEvents();
                } else {
                    this.setupMouseEvents();

                document.querySelectorAll('.tool-btn').forEach(btn => {

            }
            
            setupTouchEvents() {
                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    this.onCanvasTouchStart(touch);
                }, { passive: false });
                
                this.canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    this.onCanvasTouchMove(touch);
                }, { passive: false });
                
                this.canvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.onCanvasTouchEnd();
                });
                
                // Pinch zoom
                let lastDistance = 0;
                this.canvas.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 2) {
                        e.preventDefault();
                        const touch1 = e.touches[0];
                        const touch2 = e.touches[1];
                        const distance = Math.hypot(
                            touch2.clientX - touch1.clientX,
                            touch2.clientY - touch1.clientY
                        );
                        
                        if (lastDistance > 0) {
                            const scaleChange = distance / lastDistance;
                            this.handlePinchZoom(scaleChange, touch1, touch2);
                        }
                        lastDistance = distance;
                    }
                }, { passive: false });
                
                this.canvas.addEventListener('touchend', () => {
                    lastDistance = 0;
                });
            }
            
            setupMouseEvents() {
                this.canvas.addEventListener('mousedown', (e) => this.onCanvasMouseDown(e));
                this.canvas.addEventListener('mousemove', (e) => this.onCanvasMouseMove(e));
                this.canvas.addEventListener('mouseup', (e) => this.onCanvasMouseUp(e));
                this.canvas.addEventListener('wheel', (e) => this.onCanvasWheel(e));
            }
            
            onCanvasTouchStart(touch) {
                const rect = this.canvas.getBoundingClientRect();
                const x = (touch.clientX - rect.left) * (this.canvas.width / rect.width);
                const y = (touch.clientY - rect.top) * (this.canvas.height / rect.height);
                
                AppState.lastTouchPos = { x: touch.clientX, y: touch.clientY };
                AppState.lastMousePos = { x, y };
                
                if (AppState.currentTool === 'select') {
                    const clickedTrait = this.getTraitAt(x, y);
                    if (clickedTrait) {
                        this.selectTrait(clickedTrait);
                        AppState.isDragging = true;
                        AppState.dragStart = { x, y };
                        AppState.dragOffset = { x: clickedTrait.x, y: clickedTrait.y };
                    }
                } else if (AppState.currentTool === 'connect') {
                    const clickedTrait = this.getTraitAt(x, y);
                    if (clickedTrait) {
                        if (!AppState.isConnecting) {
                            AppState.isConnecting = true;
                            AppState.connectionStart = clickedTrait;
                            document.getElementById('connectionMode').classList.add('show');
                        } else {
                            if (AppState.connectionStart.id !== clickedTrait.id) {
                                this.createConnection(AppState.connectionStart, clickedTrait);
                                this.cancelConnection();
                            }
                        }
                    }
                } else if (AppState.currentTool === 'hand') {
                    AppState.isDragging = true;
                    AppState.dragStart = { x: touch.clientX, y: touch.clientY };
                }
            }
            
            onCanvasTouchMove(touch) {
                if (!AppState.isDragging) return;
                
                const rect = this.canvas.getBoundingClientRect();
                const x = (touch.clientX - rect.left) * (this.canvas.width / rect.width);
                const y = (touch.clientY - rect.top) * (this.canvas.height / rect.height);
                
                AppState.lastMousePos = { x, y };
                
                if (AppState.currentTool === 'select' && AppState.selectedTraits.size > 0) {
                    const dx = x - AppState.dragStart.x;
                    const dy = y - AppState.dragStart.y;
                    
                    AppState.selectedTraits.forEach(traitId => {
                        const trait = AppState.traits.get(traitId);
                        if (trait) {
                            trait.x = AppState.dragOffset.x + dx;
                            trait.y = AppState.dragOffset.y + dy;
                        }
                    });
                    
                    this.render();
                } else if (AppState.currentTool === 'hand') {
                    const dx = touch.clientX - AppState.dragStart.x;
                    const dy = touch.clientY - AppState.dragStart.y;
                    
                    AppState.traits.forEach(trait => {
                        trait.x += dx;
                        trait.y += dy;
                    });
                    
                    AppState.dragStart = { x: touch.clientX, y: touch.clientY };
                    this.render();
                }
            }
            
            onCanvasTouchEnd() {
                AppState.isDragging = false;
            }
            
            handlePinchZoom(scaleChange, touch1, touch2) {
                const rect = this.canvas.getBoundingClientRect();
                const centerX = ((touch1.clientX + touch2.clientX) / 2 - rect.left) * 
                               (this.canvas.width / rect.width);
                const centerY = ((touch1.clientY + touch2.clientY) / 2 - rect.top) * 
                               (this.canvas.height / rect.height);
                
                AppState.renderScale *= scaleChange;
                AppState.renderScale = Math.max(0.1, Math.min(3, AppState.renderScale));
                
                const scaleAdjust = scaleChange - 1;
                AppState.traits.forEach(trait => {
                    trait.x += (trait.x - centerX) * scaleAdjust;
                    trait.y += (trait.y - centerY) * scaleAdjust;
                });
                
                this.render();
            }
            
            // Mouse event handlers (similar to touch but with mouse events)
            onCanvasMouseDown(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) * (this.canvas.width / rect.width);
                const y = (e.clientY - rect.top) * (this.canvas.height / rect.height);
                
                AppState.lastMousePos = { x, y };
                
                if (AppState.currentTool === 'select') {
                    const clickedTrait = this.getTraitAt(x, y);
                    if (clickedTrait) {
                        this.selectTrait(clickedTrait);
                        AppState.isDragging = true;
                        AppState.dragStart = { x, y };
                        AppState.dragOffset = { x: clickedTrait.x, y: clickedTrait.y };
                    }
                } else if (AppState.currentTool === 'connect') {
                    const clickedTrait = this.getTraitAt(x, y);
                    if (clickedTrait) {
                        if (!AppState.isConnecting) {
                            AppState.isConnecting = true;
                            AppState.connectionStart = clickedTrait;
                            document.getElementById('connectionMode').classList.add('show');
                        } else {
                            if (AppState.connectionStart.id !== clickedTrait.id) {
                                this.createConnection(AppState.connectionStart, clickedTrait);
                                this.cancelConnection();
                            }
                        }
                    }
                } else if (AppState.currentTool === 'hand') {
                    AppState.isDragging = true;
                    AppState.dragStart = { x: e.clientX, y: e.clientY };
                }
            }
            
            onCanvasMouseMove(e) {
                if (!AppState.isDragging && !AppState.isConnecting) return;
                
                const rect = this.canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) * (this.canvas.width / rect.width);
                const y = (e.clientY - rect.top) * (this.canvas.height / rect.height);
                
                AppState.lastMousePos = { x, y };
                
                if (AppState.currentTool === 'select' && AppState.selectedTraits.size > 0) {
                    const dx = x - AppState.dragStart.x;
                    const dy = y - AppState.dragStart.y;
                    
                    AppState.selectedTraits.forEach(traitId => {
                        const trait = AppState.traits.get(traitId);
                        if (trait) {
                            trait.x = AppState.dragOffset.x + dx;
                            trait.y = AppState.dragOffset.y + dy;
                        }
                    });
                    
                    this.render();
                } else if (AppState.currentTool === 'hand') {
                    const dx = e.clientX - AppState.dragStart.x;
                    const dy = e.clientY - AppState.dragStart.y;
                    
                    AppState.traits.forEach(trait => {
                        trait.x += dx;
                        trait.y += dy;
                    });
                    
                    AppState.dragStart = { x: e.clientX, y: e.clientY };
                    this.render();
                }
            }
            
            onCanvasMouseUp() {
                AppState.isDragging = false;
            }
            
            onCanvasWheel(e) {
                e.preventDefault();
                
                const rect = this.canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) * (this.canvas.width / rect.width);
                const y = (e.clientY - rect.top) * (this.canvas.height / rect.height);
                
                const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
                AppState.renderScale *= zoomFactor;
                AppState.renderScale = Math.max(0.1, Math.min(3, AppState.renderScale));
                
                const scaleChange = zoomFactor - 1;
                AppState.traits.forEach(trait => {
                    trait.x += (trait.x - x) * scaleChange;
                    trait.y += (trait.y - y) * scaleChange;
                });
                
                this.render();
            }
            
            getTraitAt(x, y) {
                for (const trait of AppState.traits.values()) {
                    const dx = trait.x - x;
                    const dy = trait.y - y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const hitRadius = 30 * AppState.renderScale;
                    
                    if (distance < hitRadius) {
                        return trait;
                    }
                }
                return null;
            }
            
            createConnection(sourceTrait, targetTrait) {
                const connection = {
                    id: `conn-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
                    sourceId: sourceTrait.id,
                    targetId: targetTrait.id,
                    type: 'correlative',
                    strength: 40 + Math.random() * 60,
                    getColor: function() {
                        const colors = {
                            'causal': '#ff3366',
                            'correlative': '#ffaa00',
                            'therapeutic': '#00cc88'
                        };
                        return colors[this.type] || '#4d94ff';
                    },
                    getTypeLabel: function() {
                        const labels = {
                            'causal': 'Causal Relationship',
                            'correlative': 'Correlation',
                            'therapeutic': 'Treatment Effect'
                        };
                        return labels[this.type] || 'Relationship';
                    }
                };
                
                AppState.connections.set(connection.id, connection);
                this.render();
                this.showToast(`Created connection between ${sourceTrait.name} and ${targetTrait.name}`, 'success');
                
                // Update AI suggestions
                setTimeout(() => this.generateAISuggestions(), 100);
            }
            
            setTool(tool) {
                AppState.currentTool = tool;
                
                document.querySelectorAll('.tool-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.querySelector(`.tool-btn[data-tool="${tool}"]`)?.classList.add('active');
                
                if (tool === 'layout') {
                    this.arrangeNetwork();
                } else if (tool === 'delete') {
                    this.deleteSelected();
                } else if (tool === 'connect') {
                    document.getElementById('connectionMode').classList.add('show');
                } else {
                    document.getElementById('connectionMode').classList.remove('show');
                    this.cancelConnection();
                }
            }
            
            cancelConnection() {
                AppState.isConnecting = false;
                AppState.connectionStart = null;
                document.getElementById('connectionMode').classList.remove('show');
            }
            
            selectTrait(trait) {
                this.deselectAll();
                trait.selected = true;
                AppState.selectedTraits.add(trait.id);
                this.render();
                this.updateProperties();
            }
            
            deselectAll() {
                AppState.selectedTraits.clear();
                AppState.traits.forEach(trait => trait.selected = false);
                this.render();
                this.updateProperties();
            }
            
            deleteSelected() {
                if (AppState.selectedTraits.size === 0) {
                    this.showToast('Select traits to delete', 'warning');
                    return;
                }
                
                AppState.selectedTraits.forEach(traitId => {
                    AppState.traits.delete(traitId);
                });
                
                AppState.selectedTraits.clear();
                this.render();
                this.updateProperties();
                this.showToast(`Deleted ${AppState.selectedTraits.size} traits`, 'success');
            }
            
            arrangeNetwork() {
                const centerX = this.canvas.width / (2 * this.renderer.dpr);
                const centerY = this.canvas.height / (2 * this.renderer.dpr);
                const radius = Math.min(centerX, centerY) * 0.6;
                
                const traits = Array.from(AppState.traits.values());
                traits.forEach((trait, index) => {
                    const angle = (index * 2 * Math.PI) / traits.length;
                    trait.x = centerX + radius * Math.cos(angle);
                    trait.y = centerY + radius * Math.sin(angle);
                });
                
                this.render();
                this.showToast('Network arranged', 'success');
            }
            
            createDemoNetwork() {
                // Create 4 demo traits
                const demoPositions = [
                    { x: 0.3, y: 0.4 },
                    { x: 0.7, y: 0.4 },
                    { x: 0.3, y: 0.6 },
                    { x: 0.7, y: 0.6 }
                ];
                
                const colors = ['#ff3366', '#00cc88', '#ffaa00', '#9966ff'];
                const categories = ['immune', 'physio', 'clinical', 'comorbid'];
                
                demoPositions.forEach((pos, i) => {
                    const trait = {
                        id: `demo-${i}`,
                        name: `Demo Trait ${i + 1}`,
                        category: categories[i],
                        color: colors[i],
                        x: this.canvas.width * pos.x / this.renderer.dpr,
                        y: this.canvas.height * pos.y / this.renderer.dpr
                    };
                    
                    AppState.traits.set(trait.id, trait);
                });
                
                this.render();
            }
            
            importPatient() {
                this.showToast('Patient import feature', 'info');
            }
            
            runSimulation() {
                this.showToast('Running clinical simulation...', 'info');
                
                // Simple simulation
                AppState.traits.forEach(trait => {
                    trait.severity = Math.max(0, Math.min(100, trait.severity + (Math.random() * 20 - 10)));
                });
                
                this.render();
                this.updateProperties();
                this.showToast('Simulation complete!', 'success');
            }
            
            shareAnalysis() {
                const analysis = {
                    traits: Array.from(AppState.traits.values()),
                    connections: Array.from(AppState.connections.values()),
                    timestamp: new Date().toISOString()
                };
                
                const dataStr = `data:text/json;charset=utf-8,${encodeURIComponent(JSON.stringify(analysis, null, 2))}`;
                const link = document.createElement('a');
                link.href = dataStr;
                link.download = `traitmap-analysis-${new Date().toISOString().split('T')[0]}.json`;
                link.click();
                
                this.showToast('Analysis exported', 'success');
            }
            
            saveSession() {
                localStorage.setItem('traitmap-session', JSON.stringify({
                    traits: Array.from(AppState.traits.values()),
                    connections: Array.from(AppState.connections.values())
                }));
                this.showToast('Session saved', 'success');
            }
            
            generateAISuggestions() {
                const container = document.getElementById('aiSuggestions');
                if (!container) return;
                
                const traits = Array.from(AppState.traits.values());
                if (traits.length < 2) {
                    container.classList.remove('show');
                    return;
                }
                
                const suggestions = [
                    {
                        title: 'Consider connecting related traits',
                        description: 'Connect traits to build clinical pathways',
                        action: () => {
                            if (traits.length >= 2) {
                                this.createConnection(traits[0], traits[1]);
                            }
                        }
                    },
                    {
                        title: 'Run network analysis',
                        description: 'Analyze connections and patterns',
                        action: () => {
                            this.showToast('Network analysis feature coming soon!', 'info');
                        }
                    },
                    {
                        title: 'Explore treatment options',
                        description: 'View evidence-based interventions',
                        action: () => {
                            this.showToast('Treatment explorer coming soon!', 'info');
                        }
                    }
                ];
                
                let html = '<div class="ai-suggestion-title"><i class="fas fa-robot"></i> AI Suggestions</div>';
                
                suggestions.forEach((suggestion, index) => {
                    html += `
                        <div class="ai-suggestion-item" onclick="app.handleSuggestion(${index})">
                            <div style="font-weight: 700; margin-bottom: 0.25rem;">${suggestion.title}</div>
                            <div style="font-size: 0.85rem; color: var(--text-secondary);">
                                ${suggestion.description}
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
                
                // Show suggestions panel automatically on desktop, but not on mobile
                if (!AppState.isMobile) {
                    container.classList.add('show');
                }
            }
            
            handleSuggestion(index) {
                const suggestions = [
                    () => {
                        const traits = Array.from(AppState.traits.values());
                        if (traits.length >= 2) {
                            this.createConnection(traits[0], traits[1]);
                        }
                    },
                    () => {
                        this.showToast('Network analysis feature coming soon!', 'info');
                    },
                    () => {
                        this.showToast('Treatment explorer coming soon!', 'info');
                    }
                ];
                
                if (suggestions[index]) {
                    suggestions[index]();
                }
            }
            
            updateProperties() {
                const container = document.querySelector('.properties-content');
                if (!container) return;
                
                const selectedTraits = Array.from(AppState.selectedTraits).map(id => AppState.traits.get(id));
                
                if (selectedTraits.length === 0) {
                    container.innerHTML = `
                        <div style="padding: 2rem; text-align: center; color: var(--text-secondary);">
                            <i class="fas fa-mouse-pointer" style="font-size: 3rem; opacity: 0.3; margin-bottom: 1rem;"></i>
                            <p>Select a trait to view properties</p>
                        </div>
                    `;
                    return;
                }
                
                const trait = selectedTraits[0];
                container.innerHTML = `
                    <div class="property-section">
                        <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem;">
                            <div style="width: 50px; height: 50px; background: ${trait.color}; 
                                 border-radius: 12px; display: flex; align-items: center; justify-content: center;">
                                <i class="fas fa-circle" style="color: white;"></i>
                            </div>
                            <div>
                                <h3 style="font-weight: 800;">${trait.name}</h3>
                                <div style="color: var(--text-secondary);">${trait.category}</div>
                            </div>
                        </div>
                        
                        <div style="display: grid; gap: 1rem;">
                            <div>
                                <div style="display: flex; justify-content: space-between; margin-bottom: 0.25rem;">
                                    <span>Severity</span>
                                    <span>${trait.severity || 50}%</span>
                                </div>
                                <div style="height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 3px;">
                                    <div style="width: ${trait.severity || 50}%; height: 100%; 
                                         background: ${trait.severity > 70 ? '#ff3366' : trait.severity > 40 ? '#ffaa00' : '#00cc88'}; 
                                         border-radius: 3px;"></div>
                                </div>
                            </div>
                            
                            <div>
                                <div style="display: flex; justify-content: space-between; margin-bottom: 0.25rem;">
                                    <span>Confidence</span>
                                    <span>${trait.confidence || 75}%</span>
                                </div>
                                <div style="height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 3px;">
                                    <div style="width: ${trait.confidence || 75}%; height: 100%; 
                                         background: #4d94ff; border-radius: 3px;"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            render() {
                this.renderer.render(AppState.traits, AppState.connections, AppState.renderScale, AppState.selectedTraits);
            }
            
            startRenderLoop() {
                const renderLoop = () => {
                    this.render();
                    requestAnimationFrame(renderLoop);
                };
                requestAnimationFrame(renderLoop);
            }
            
            showToast(message, type = 'info') {
                const container = document.getElementById('toastContainer');
                
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = `
                    <div class="toast-icon">
                        <i class="fas fa-${type === 'success' ? 'check-circle' : 
                                          type === 'error' ? 'exclamation-circle' : 
                                          type === 'warning' ? 'exclamation-triangle' : 'info-circle'}"></i>
                    </div>
                    <div class="toast-message">${message}</div>
                `;
                
                container.appendChild(toast);
                
                setTimeout(() => toast.classList.add('show'), 10);
                
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => {
                        if (toast.parentNode === container) {
                            container.removeChild(toast);
                        }
                    }, 300);
                }, 3000);
            }
        }
        
        // ==================== INITIALIZATION ====================
        
        let app;
        
        document.addEventListener('DOMContentLoaded', () => {
            // Optimized loading sequence
            const loadingFill = document.getElementById('loadingFill');
            const loadingMessage = document.getElementById('loadingMessage');
            const loadingScreen = document.getElementById('loadingScreen');
            
            let progress = 0;
            const interval = setInterval(() => {
                progress += 2;
                if (progress > 100) progress = 100;
                
                loadingFill.style.width = `${progress}%`;
                
                if (progress >= 100) {
                    clearInterval(interval);
                    loadingMessage.textContent = "Ready!";
                    
                    setTimeout(() => {
                        loadingScreen.style.opacity = '0';
                        
                        setTimeout(() => {
                            loadingScreen.style.display = 'none';
                            app = new MobileOptimizedApp();
                            window.app = app;
                        }, 500);
                    }, 500);
                }
            }, 30);
        });
        
        // Handle mobile orientation changes
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                if (app && app.renderer) {
                    app.renderer.resize();
                    app.render();
                }
            }, 300);
        });
        
        // Prevent context menu on touch devices
        document.addEventListener('contextmenu', (e) => {
            if (AppState.isTouchDevice) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
